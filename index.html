<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPS PHOTO: GEO TAGGING</title>
<style>
:root{--maroon:#A20404;--gold:#FBBC09}
*{box-sizing:border-box}
html,body{margin:0;background:#f3f4f6;color:#111;font-family:Arial,sans-serif}
header{background:#fff;padding:12px;border-bottom:1px solid #ddd;text-align:center}
header h1{margin:0;font-size:20px}
main{max-width:1100px;margin:auto;padding:12px}
.card{background:#fff;border-radius:15px;padding:12px;box-shadow:0 2px 12px #0001}
.camera{position:relative;background:#111;border-radius:12px;overflow:hidden;min-height:280px;display:flex;justify-content:center;align-items:center}
#placeholder{color:#ddd;text-align:center;padding:25px}
#placeholder .icon{font-size:55px}
#video{display:none;width:100%;height:auto;max-height:78vh;object-fit:contain;background:#000}
#liveBox{display:none;position:absolute;left:3%;right:3%;bottom:3%;background:rgba(255,255,255,.5);border:2px solid var(--gold);border-radius:12px;padding:9px;color:#000;font-family:Georgia,serif;pointer-events:none}
.liveLine{font-weight:700;font-size:clamp(14px,2.2vw,22px);line-height:1.15;margin:3px 0;overflow:hidden}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{border:0;border-radius:9px;padding:12px 15px;min-height:46px;font-weight:800;font-size:15px}
button:disabled{opacity:.45}
#ready{background:#16a34a;color:#fff}
#capture{background:#2563eb;color:#fff}
.secondary{background:#e5e7eb}
.zoom{background:#111827;color:#fff;font-size:20px;min-width:48px}
.zoomText{align-self:center;font-weight:800}
label{display:block;font-weight:800;margin:14px 0 6px}
input[type=text],input[type=file]{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
input[type=file]{background:#f8fafc}
#logoPreview{display:none;max-width:150px;max-height:80px;margin-top:7px;border:1px solid #bbb;border-radius:6px}
#status{margin-top:10px;background:#f1f5f9;padding:10px;border-radius:8px;font-size:14px}
.warning{background:#fff7ed!important;color:#9a3412}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>GPS PHOTO: GEO TAGGING</h1></header>
<main>
<div class="card">
  <div class="camera">
    <div id="placeholder"><div class="icon">📷</div><h2>GPS PHOTO: GEO TAGGING</h2><p>Press READY to start.</p></div>
    <video id="video" autoplay muted playsinline></video>
    <div id="liveBox"><div id="liveLines"></div></div>
  </div>

  <div class="controls">
    <button id="ready">READY</button>
    <button id="switchCamera" class="secondary hidden">SWITCH CAMERA</button>
    <button id="zoomOut" class="zoom hidden">−</button>
    <span id="zoomText" class="zoomText hidden">Zoom 1.0×</span>
    <button id="zoomIn" class="zoom hidden">+</button>
    <button id="capture" class="hidden">CAPTURE PHOTO</button>
  </div>

  <label>Additional Information</label>
  <input id="additional" type="text" placeholder="Enter additional information">

  <label>Visited By</label>
  <input id="visited" type="text" placeholder="Enter name">

  <label>Company Logo</label>
  <input id="logo" type="file" accept="image/png,image/jpeg,image/webp">
  <img id="logoPreview" alt="Logo preview">

  <div id="status">Press READY.</div>
  <div id="httpsWarning" class="warning hidden">
    Camera and GPS require HTTPS. Publish this index.html on GitHub Pages, Netlify, or another HTTPS host.
  </div>
</div>
</main>

<script>
"use strict";

const video=document.getElementById("video");
const placeholder=document.getElementById("placeholder");
const liveBox=document.getElementById("liveBox");
const liveLines=document.getElementById("liveLines");
const ready=document.getElementById("ready");
const switchCamera=document.getElementById("switchCamera");
const zoomOut=document.getElementById("zoomOut");
const zoomIn=document.getElementById("zoomIn");
const zoomText=document.getElementById("zoomText");
const capture=document.getElementById("capture");
const additional=document.getElementById("additional");
const visited=document.getElementById("visited");
const logo=document.getElementById("logo");
const logoPreview=document.getElementById("logoPreview");
const status=document.getElementById("status");
const httpsWarning=document.getElementById("httpsWarning");

let stream=null;
let timer=null;
let facing="environment";
let zoom=1;
let logoImage=null;
let lastUrl=null;

const gps={
  lat:null,lon:null,accuracy:null,address:"",
  countryCode:"",countryName:"",plusCode:""
};

function secure(){
  return window.isSecureContext||location.hostname==="localhost"||location.hostname==="127.0.0.1";
}
if(!secure())httpsWarning.classList.remove("hidden");

function msg(t){status.textContent=t}

function flag(code){
  code=String(code||"").toUpperCase();
  if(!/^[A-Z]{2}$/.test(code))return"";
  return String.fromCodePoint(...[...code].map(c=>127397+c.charCodeAt(0)));
}

function gmt(d=new Date()){
  const m=-d.getTimezoneOffset(),s=m>=0?"+":"-",a=Math.abs(m);
  return"GMT"+s+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");
}

function timeInfo(){
  const d=new Date();
  return{
    day:d.toLocaleDateString(undefined,{weekday:"long"}),
    date:d.toLocaleDateString("en-GB"),
    time:d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",hour12:true}),
    gmt:gmt(d)
  };
}

/* Open Location Code compatible pair encoder */
function plusCode(lat,lon){
  const alphabet="23456789CFGHJMPQRVWX";
  lat=Math.max(-90,Math.min(90,Number(lat)));
  lon=((Number(lon)+180)%360+360)%360-180;
  if(lat===90)lat-=1e-12;
  lat+=90;lon+=180;
  const res=[20,1,.05,.0025];
  let out="";
  for(const r of res){
    let a=Math.max(0,Math.min(19,Math.floor(lat/r)));
    let b=Math.max(0,Math.min(19,Math.floor(lon/r)));
    out+=alphabet[a]+alphabet[b];
    lat-=a*r;lon-=b*r;
  }
  return out.slice(0,8)+"+"+out.slice(8,10);
}

function wrap(ctx,text,font,maxWidth){
  ctx.font=font;
  const words=String(text||"").trim().split(/\s+/);
  if(!words.length||!words[0])return[];
  const lines=[];let line="";
  for(const word of words){
    let test=line?line+" "+word:word;
    if(ctx.measureText(test).width<=maxWidth){line=test;continue}
    if(line){lines.push(line);line=""}
    if(ctx.measureText(word).width<=maxWidth){line=word;continue}
    let piece="";
    for(const ch of word){
      if(ctx.measureText(piece+ch).width<=maxWidth)piece+=ch;
      else{if(piece)lines.push(piece);piece=ch}
    }
    line=piece;
  }
  if(line)lines.push(line);
  return lines;
}

function stopCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;video.srcObject=null;liveBox.style.display="none";
}

async function startCamera(){
  try{
    stopCamera();
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    placeholder.style.display="none";
    video.style.display="block";
    liveBox.style.display="block";
    switchCamera.classList.remove("hidden");
    zoomOut.classList.remove("hidden");
    zoomIn.classList.remove("hidden");
    zoomText.classList.remove("hidden");
    capture.classList.remove("hidden");
    zoom=1;
    video.style.transform="scale(1)";
    zoomUI();
    updateLive();
    return true;
  }catch(e){
    if(e.name==="NotAllowedError")msg("Camera permission denied. Allow camera access in browser settings.");
    else msg("Camera error: "+(e.message||e.name));
    return false;
  }
}

async function switchCam(){
  facing=facing==="environment"?"user":"environment";
  await startCamera();
  getGPS();
}

async function setZoom(z){
  z=Math.max(1,Math.min(8,z));
  const track=stream?.getVideoTracks?.()[0];
  if(track){
    try{
      const c=track.getCapabilities?.()||{};
      if(c.zoom){
        const min=Number(c.zoom.min??1),max=Math.min(8,Number(c.zoom.max??8)),step=Number(c.zoom.step??.1);
        z=Math.min(max,Math.max(min,Math.round(z/step)*step));
        await track.applyConstraints({advanced:[{zoom:z}]});
        video.style.transform="scale(1)";
      }else video.style.transform="scale("+z+")";
    }catch(e){video.style.transform="scale("+z+")"}
  }
  zoom=z;zoomUI();
}
function zoomUI(){
  zoomText.textContent="Zoom "+zoom.toFixed(1)+"×";
  zoomOut.disabled=zoom<=1;zoomIn.disabled=zoom>=8;
}

async function geocode(lat,lon){
  try{
    const u="https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat="+encodeURIComponent(lat)+"&lon="+encodeURIComponent(lon);
    const r=await fetch(u,{headers:{Accept:"application/json"}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json(),a=d.address||{};
    gps.address=d.display_name||[
      a.road,a.neighbourhood,a.suburb,a.village,a.town,a.city,
      a.district,a.state_district,a.state,a.postcode,a.country
    ].filter(Boolean).join(", ")||gps.address||"Address unavailable";
    gps.countryCode=String(a.country_code||gps.countryCode||"").toUpperCase();
    gps.countryName=String(a.country||gps.countryName||"").trim();

    /* Put flag directly after the country at the end of the address. */
    const f=flag(gps.countryCode);
    if(f&&!gps.address.includes(f)){
      if(gps.countryName){
        const i=gps.address.toLowerCase().lastIndexOf(gps.countryName.toLowerCase());
        if(i>=0){
          gps.address=gps.address.slice(0,i)+gps.address.slice(i,i+gps.countryName.length)+ " "+f + gps.address.slice(i+gps.countryName.length);
        }else gps.address+=", "+gps.countryName+" "+f;
      }else gps.address+=" "+f;
    }
    updateLive();
  }catch(e){
    msg("GPS is working, but address lookup is temporarily unavailable.");
  }
}

function positionUpdate(p){
  gps.lat=Number(p.coords.latitude);
  gps.lon=Number(p.coords.longitude);
  gps.accuracy=Number(p.coords.accuracy);
  gps.plusCode=plusCode(gps.lat,gps.lon);
  updateLive();
}

function getGPS(){
  if(!navigator.geolocation){msg("GPS is not supported by this browser.");return}
  navigator.geolocation.getCurrentPosition(async p=>{
    positionUpdate(p);
    await geocode(gps.lat,gps.lon);
    msg("GPS updated: "+new Date().toLocaleTimeString());
  },e=>{
    if(e.code===1)msg("Location permission denied. Allow Location access in browser settings.");
    else msg("Unable to get GPS location. Trying again.");
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

function freshGPS(){
  return new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(async p=>{
      positionUpdate(p);
      await geocode(gps.lat,gps.lon);
      resolve();
    },reject,{enableHighAccuracy:true,timeout:12000,maximumAge:0});
  });
}

function updateLive(){
  if(!stream)return;
  const t=timeInfo();
  const lines=[
    gps.address||"Waiting for address...",
    gps.plusCode||"—",
    "LATITUDE: "+(gps.lat==null?"—":gps.lat.toFixed(6)+"°")+"   |   LONGITUDE: "+(gps.lon==null?"—":gps.lon.toFixed(6)+"°"),
    t.day+" | DATE: "+t.date+" | TIME: "+t.time+" | "+t.gmt,
    "ACCURACY: "+(gps.accuracy==null?"—":Math.round(gps.accuracy)+" m")
  ];
  if(additional.value.trim())lines.push(additional.value.trim());
  if(visited.value.trim())lines.push("Visited By: "+visited.value.trim());
  liveLines.innerHTML=lines.map(x=>"<div class='liveLine'>"+x.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+"</div>").join("");
}

logo.addEventListener("change",()=>{
  const f=logo.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const im=new Image();
    im.onload=()=>{logoImage=im;logoPreview.src=e.target.result;logoPreview.style.display="block"};
    im.src=e.target.result;
  };
  reader.readAsDataURL(f);
});

additional.addEventListener("input",updateLive);
visited.addEventListener("input",updateLive);

function drawRoundedRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function capturePhoto(){
  if(!stream||!video.videoWidth){msg("Camera is not ready.");return}
  capture.disabled=true;
  msg("Getting current GPS position...");
  freshGPS().catch(()=>{}).then(renderPhoto);
}

function renderPhoto(){
  if(gps.lat!=null&&gps.lon!=null)gps.plusCode=plusCode(gps.lat,gps.lon);

  const sw=video.videoWidth,sh=video.videoHeight;
  const border=Math.max(6,Math.round(sw*.006));
  const W=sw+border*2,H=sh+border*2;
  const canvas=document.createElement("canvas");
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext("2d");

  /* Camera image */
  if(zoom<=1.001){
    ctx.drawImage(video,border,border,sw,sh);
  }else{
    const cw=sw/zoom,ch=sh/zoom,cx=(sw-cw)/2,cy=(sh-ch)/2;
    ctx.drawImage(video,cx,cy,cw,ch,border,border,sw,sh);
  }

  /* Photo border */
  ctx.lineWidth=border;ctx.strokeStyle="#A20404";
  ctx.strokeRect(border/2,border/2,W-border,H-border);

  const panelW=Math.min(W-40,W*.92);
  const panelX=(W-panelW)/2;
  const pad=Math.max(22,Math.round(W*.025));
  const contentW=panelW-pad*2;

  const addressSize=48; /* 36pt */
  let bodySize=32; /* 24pt */
  const gap=Math.max(7,Math.round(bodySize*.18));
  const blockGap=Math.max(10,Math.round(bodySize*.28));
  const topPad=Math.max(22,Math.round(bodySize*.7));
  const bottomPad=Math.max(22,Math.round(bodySize*.6));

  const addressFont="bold "+addressSize+"px Georgia,serif";
  const normalFont=size=>"bold "+size+"px Georgia,serif";

  const addressLines=wrap(ctx,gps.address||"Address unavailable",addressFont,contentW);
  const plusLines=wrap(ctx,gps.plusCode||"—",normalFont(bodySize),contentW);

  /*
    CRITICAL: Latitude and Longitude are ONE canvas text operation.
    They are NEVER passed through the wrapping function.
    The font is reduced until the entire string fits.
  */
  const lat="LATITUDE: "+(gps.lat==null?"—":gps.lat.toFixed(6)+"°");
  const lon="LONGITUDE: "+(gps.lon==null?"—":gps.lon.toFixed(6)+"°");
  const latLonText=lat+"   |   "+lon;

  let latLonSize=bodySize;
  while(latLonSize>24){
    ctx.font=normalFont(latLonSize);
    if(ctx.measureText(latLonText).width<=contentW)break;
    latLonSize--;
  }
  const latLonFont=normalFont(latLonSize);

  const t=timeInfo();
  const dateText=t.day+" | DATE: "+t.date+" | TIME: "+t.time+" | "+t.gmt;
  const dateLines=wrap(ctx,dateText,normalFont(bodySize),contentW);
  const accLines=wrap(ctx,"ACCURACY: "+(gps.accuracy==null?"—":Math.round(gps.accuracy)+" m"),normalFont(bodySize),contentW);
  const extra=additional.value.trim();
  const visitor=visited.value.trim();
  const extraLines=extra?wrap(ctx,extra,normalFont(bodySize),contentW):[];
  const visitorLines=visitor?wrap(ctx,"Visited By: "+visitor,normalFont(bodySize),contentW):[];

  function sectionHeight(lines,size){
    return lines.length*(size+gap)+blockGap;
  }

  let panelH=topPad+
    sectionHeight(addressLines,addressSize)+
    sectionHeight(plusLines,bodySize)+
    (latLonSize+gap+blockGap)+
    sectionHeight(dateLines,bodySize)+
    sectionHeight(accLines,bodySize)+
    (extraLines.length?sectionHeight(extraLines,bodySize):0)+
    (visitorLines.length?sectionHeight(visitorLines,bodySize):0);

  let logoW=0,logoH=0;
  if(logoImage){
    const maxW=Math.min(contentW*.22,180),maxH=Math.min(H*.10,110);
    const s=Math.min(maxW/logoImage.width,maxH/logoImage.height,1);
    logoW=logoImage.width*s;logoH=logoImage.height*s;
    panelH+=logoH+blockGap*.5;
  }
  panelH+=bottomPad;

  const panelY=Math.max(border+8,H-panelH-Math.max(18,H*.018));

  /* Panel */
  ctx.fillStyle="rgba(255,255,255,.50)";
  drawRoundedRect(ctx,panelX,panelY,panelW,panelH,20);
  ctx.fill();
  ctx.lineWidth=Math.max(2,Math.round(W*.002));
  ctx.strokeStyle="#FBBC09";
  ctx.stroke();

  /* Unified content */
  ctx.fillStyle="#000";
  ctx.textAlign="left";
  ctx.textBaseline="alphabetic";
  let y=panelY+topPad;

  function drawBlock(lines,font,size){
    ctx.font=font;
    for(const line of lines){
      y+=size;
      ctx.fillText(line,panelX+pad,y);
      y+=gap;
    }
    y+=blockGap-gap;
  }

  /* Address: separate block */
  drawBlock(addressLines,addressFont,addressSize);

  /* Plus Code: separate block */
  drawBlock(plusLines,normalFont(bodySize),bodySize);

  /* LATITUDE + LONGITUDE: forced one physical line */
  ctx.font=latLonFont;
  y+=latLonSize;
  ctx.fillText(latLonText,panelX+pad,y);
  y+=gap+blockGap-gap;

  drawBlock(dateLines,normalFont(bodySize),bodySize);
  drawBlock(accLines,normalFont(bodySize),bodySize);

  if(extraLines.length)drawBlock(extraLines,normalFont(bodySize),bodySize);
  if(visitorLines.length)drawBlock(visitorLines,normalFont(bodySize),bodySize);

  if(logoImage){
    const lx=panelX+panelW-pad-logoW;
    const ly=panelY+panelH-bottomPad-logoH;
    ctx.drawImage(logoImage,lx,ly,logoW,logoH);
  }

  canvas.toBlob(blob=>{
    if(!blob){msg("Could not create JPG.");capture.disabled=false;return}
    if(lastUrl)URL.revokeObjectURL(lastUrl);
    lastUrl=URL.createObjectURL(blob);

    const a=document.createElement("a");
    const d=new Date();
    const filename="GPS-PHOTO-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+"-"+String(d.getMinutes()).padStart(2,"0")+"-"+String(d.getSeconds()).padStart(2,"0")+".jpg";
    a.href=lastUrl;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();

    msg("Photo captured and downloaded automatically.");
    setTimeout(async()=>{
      const ok=await startCamera();
      capture.disabled=false;
      if(ok){getGPS();msg("Ready for the next photo.")}
    },500);
  },"image/jpeg",.94);
}

ready.addEventListener("click",async()=>{
  if(!secure()){httpsWarning.classList.remove("hidden");msg("Camera and GPS require HTTPS.");return}
  ready.disabled=true;
  const ok=await startCamera();
  if(!ok){ready.disabled=false;return}
  getGPS();
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{if(stream)getGPS()},40000);
  ready.textContent="READY ✓";
});

switchCamera.addEventListener("click",switchCam);
zoomOut.addEventListener("click",()=>setZoom(zoom-.5));
zoomIn.addEventListener("click",()=>setZoom(zoom+.5));
capture.addEventListener("click",capturePhoto);

window.addEventListener("beforeunload",()=>{
  if(timer)clearInterval(timer);
  stopCamera();
  if(lastUrl)URL.revokeObjectURL(lastUrl);
});
</script>
</body>
</html>
