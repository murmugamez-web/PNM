<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>GPS PHOTO: GEO TAGGING</title>
<style>
:root{
  --maroon:#A20404;
  --gold:#FBBC09;
  --panel:rgba(255,255,255,.50);
  --text:#000;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f4f6;color:#111}
body{font-family:Arial,Helvetica,sans-serif}
header{
  background:#fff;border-bottom:1px solid #ddd;padding:12px 14px;
  position:sticky;top:0;z-index:20
}
header h1{margin:0;text-align:center;font-size:21px}
main{width:min(1100px,100%);margin:auto;padding:12px}
.card{
  background:#fff;border-radius:16px;padding:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.08)
}
.camera{
  position:relative;width:100%;background:#111;border-radius:12px;
  overflow:hidden;min-height:280px;display:flex;align-items:center;
  justify-content:center
}
#placeholder{
  min-height:280px;width:100%;display:flex;align-items:center;
  justify-content:center;flex-direction:column;color:#ddd;text-align:center;padding:20px
}
#placeholder .camicon{font-size:55px}
#video{
  display:none;width:100%;height:auto;max-height:78vh;
  object-fit:contain;background:#000
}
#preview{
  display:none;width:100%;height:auto;background:#000
}
#liveBox{
  display:none;position:absolute;left:3%;right:3%;bottom:3%;
  background:rgba(255,255,255,.50);border:2px solid var(--gold);
  border-radius:14px;color:#000;padding:10px 12px;
  font-family:Georgia,"Times New Roman",serif;pointer-events:none
}
.liveLine{
  font-weight:700;font-size:clamp(14px,2.4vw,23px);
  line-height:1.18;margin:4px 0;overflow-wrap:anywhere
}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{
  border:0;border-radius:10px;padding:12px 15px;min-height:46px;
  font-weight:800;font-size:15px;cursor:pointer;touch-action:manipulation
}
button:disabled{opacity:.45;cursor:not-allowed}
#ready{background:#16a34a;color:#fff}
#capture{background:#2563eb;color:#fff}
.secondary{background:#e5e7eb;color:#111}
.zoom{background:#111827;color:#fff;min-width:50px;font-size:21px}
.zoomText{font-weight:800;align-self:center;padding:0 3px}
label{display:block;font-weight:800;margin:15px 0 6px}
input[type=text]{
  width:100%;padding:12px;border:1px solid #cbd5e1;
  border-radius:9px;font-size:16px
}
input[type=file]{
  width:100%;padding:10px;border:1px dashed #94a3b8;
  border-radius:9px;background:#f8fafc
}
#logoPreview{
  display:none;max-width:150px;max-height:80px;margin-top:8px;
  border:1px solid #bbb;border-radius:7px;object-fit:contain
}
.status{
  margin-top:10px;padding:10px;border-radius:8px;
  background:#f1f5f9;font-size:14px;overflow-wrap:anywhere
}
.warning{background:#fff7ed;color:#9a3412}
.hidden{display:none!important}
</style>
</head>
<body>

<header><h1>GPS PHOTO: GEO TAGGING</h1></header>

<main>
<section class="card">

  <div class="camera">
    <div id="placeholder">
      <div class="camicon">📷</div>
      <h2>GPS PHOTO: GEO TAGGING</h2>
      <p>Press READY to start the camera and GPS.</p>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <img id="preview" alt="Captured GPS photograph">

    <div id="liveBox">
      <div id="liveLines"></div>
    </div>
  </div>

  <div class="controls">
    <button id="ready">READY</button>
    <button id="switchCamera" class="secondary hidden">🔄 SWITCH CAMERA</button>
    <button id="zoomOut" class="zoom hidden">−</button>
    <span id="zoomText" class="zoomText hidden">Zoom 1.0×</span>
    <button id="zoomIn" class="zoom hidden">+</button>
    <button id="capture" class="hidden">📸 CAPTURE PHOTO</button>
  </div>

  <label for="additional">Additional Information</label>
  <input id="additional" type="text" placeholder="Enter additional information">

  <label for="visitedBy">Visited By</label>
  <input id="visitedBy" type="text" placeholder="Enter name">

  <label for="logoInput">Company Logo</label>
  <input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp">
  <img id="logoPreview" alt="Company logo preview">

  <div id="status" class="status">Press READY.</div>

  <div id="httpsWarning" class="status warning hidden">
    Camera and GPS require HTTPS. Publish this index.html on GitHub Pages, Netlify, or another HTTPS host.
  </div>

</section>
</main>

<script>
"use strict";

/* =========================================================
   ELEMENTS / STATE
   ========================================================= */

const $ = id => document.getElementById(id);

const video = $("video");
const preview = $("preview");
const placeholder = $("placeholder");
const liveBox = $("liveBox");
const liveLines = $("liveLines");

const readyBtn = $("ready");
const switchBtn = $("switchCamera");
const zoomOutBtn = $("zoomOut");
const zoomInBtn = $("zoomIn");
const zoomText = $("zoomText");
const captureBtn = $("capture");

const additionalInput = $("additional");
const visitedInput = $("visitedBy");
const logoInput = $("logoInput");
const logoPreview = $("logoPreview");
const statusBox = $("status");

let stream = null;
let gpsTimer = null;
let facingMode = "environment";
let zoomLevel = 1;
let logoImage = null;
let lastObjectUrl = null;

let gps = {
  lat:null,
  lon:null,
  accuracy:null,
  address:"",
  countryCode:"",
  countryName:"",
  plusCode:""
};

/* =========================================================
   BASIC HELPERS
   ========================================================= */

function setStatus(text){
  statusBox.textContent = text;
}

function isSecure(){
  return window.isSecureContext ||
         location.hostname === "localhost" ||
         location.hostname === "127.0.0.1";
}

if(!isSecure()){
  $("httpsWarning").classList.remove("hidden");
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

function countryFlag(countryCode){
  const code = String(countryCode || "").toUpperCase();
  if(!/^[A-Z]{2}$/.test(code)) return "🌐";
  return String.fromCodePoint(
    ...[...code].map(c => 127397 + c.charCodeAt(0))
  );
}

function getGMTOffset(date = new Date()){
  const minutes = -date.getTimezoneOffset();
  const sign = minutes >= 0 ? "+" : "-";
  const abs = Math.abs(minutes);
  return "GMT" + sign +
    String(Math.floor(abs / 60)).padStart(2,"0") + ":" +
    String(abs % 60).padStart(2,"0");
}

function getDateParts(date = new Date()){
  return {
    day: date.toLocaleDateString(undefined,{weekday:"long"}),
    date: date.toLocaleDateString("en-GB"),
    time: date.toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }),
    gmt:getGMTOffset(date)
  };
}

/* =========================================================
   PLUS CODE / OPEN LOCATION CODE
   ========================================================= */

/*
  Compact Open Location Code compatible encoder.
  Produces an 8-digit pair code plus "+" separator.
*/
function encodePlusCode(latitude, longitude){
  const alphabet = "23456789CFGHJMPQRVWX";

  let lat = Number(latitude);
  let lon = Number(longitude);

  if(!Number.isFinite(lat) || !Number.isFinite(lon)) return "—";

  lat = Math.max(-90, Math.min(90, lat));
  lon = ((lon + 180) % 360 + 360) % 360 - 180;

  if(lat === 90) lat = lat - 1e-12;

  lat += 90;
  lon += 180;

  const resolutions = [20, 1, 0.05, 0.0025];

  let code = "";

  for(const resolution of resolutions){
    let latDigit = Math.floor(lat / resolution);
    let lonDigit = Math.floor(lon / resolution);

    latDigit = Math.max(0, Math.min(19, latDigit));
    lonDigit = Math.max(0, Math.min(19, lonDigit));

    code += alphabet[latDigit] + alphabet[lonDigit];

    lat -= latDigit * resolution;
    lon -= lonDigit * resolution;
  }

  return code.slice(0,8) + "+" + code.slice(8,10);
}

function updatePlusCodeFromCurrentGPS(){
  if(gps.lat !== null && gps.lon !== null){
    gps.plusCode = encodePlusCode(gps.lat,gps.lon);
  }
}

/* =========================================================
   TEXT WRAPPING
   ========================================================= */

function wrapCanvasText(ctx,text,font,maxWidth){
  ctx.font = font;

  const words = String(text).trim().split(/\s+/);
  if(!words.length || !words[0]) return [];

  const lines = [];
  let line = "";

  for(const word of words){
    const candidate = line ? line + " " + word : word;

    if(ctx.measureText(candidate).width <= maxWidth){
      line = candidate;
      continue;
    }

    if(line){
      lines.push(line);
      line = "";
    }

    if(ctx.measureText(word).width <= maxWidth){
      line = word;
      continue;
    }

    /* Break a single overlong word safely. */
    let piece = "";
    for(const ch of word){
      const test = piece + ch;
      if(ctx.measureText(test).width <= maxWidth){
        piece = test;
      }else{
        if(piece) lines.push(piece);
        piece = ch;
      }
    }
    line = piece;
  }

  if(line) lines.push(line);
  return lines;
}

/* =========================================================
   CAMERA
   ========================================================= */

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track => track.stop());
  }
  stream = null;
  video.srcObject = null;
  liveBox.style.display = "none";
}

async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      setStatus("This browser does not support camera access.");
      return false;
    }

    stopCamera();

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:facingMode},
        width:{ideal:1920},
        height:{ideal:1080}
      },
      audio:false
    });

    video.srcObject = stream;
    await video.play();

    placeholder.style.display = "none";
    video.style.display = "block";
    preview.style.display = "none";

    switchBtn.classList.remove("hidden");
    zoomOutBtn.classList.remove("hidden");
    zoomInBtn.classList.remove("hidden");
    zoomText.classList.remove("hidden");
    captureBtn.classList.remove("hidden");

    zoomLevel = 1;
    video.style.transform = "scale(1)";
    updateZoomUI();

    updateLiveOverlay();

    setStatus(
      facingMode === "environment"
        ? "Rear camera started. GPS tracking is active."
        : "Front camera started. GPS tracking is active."
    );

    return true;

  }catch(error){
    console.error(error);

    if(error.name === "NotAllowedError"){
      setStatus("Camera permission denied. Allow camera access in browser settings.");
    }else if(error.name === "NotFoundError"){
      setStatus("No camera was found on this device.");
    }else{
      setStatus("Camera error: " + (error.message || error.name));
    }

    return false;
  }
}

async function switchCamera(){
  facingMode = facingMode === "environment" ? "user" : "environment";
  const ok = await startCamera();

  if(ok){
    getGPS();
  }
}

/* =========================================================
   CAMERA ZOOM
   ========================================================= */

async function setZoom(value){
  value = Math.max(1, Math.min(8, value));

  const track = stream?.getVideoTracks?.()[0];

  if(track){
    try{
      const capabilities = track.getCapabilities?.() || {};

      if(capabilities.zoom){
        const min = Number(capabilities.zoom.min ?? 1);
        const max = Math.min(8, Number(capabilities.zoom.max ?? 8));
        const step = Number(capabilities.zoom.step ?? 0.1);

        value = Math.min(
          max,
          Math.max(min, Math.round(value / step) * step)
        );

        await track.applyConstraints({
          advanced:[{zoom:value}]
        });

        video.style.transform = "scale(1)";
      }else{
        video.style.transform = "scale(" + value + ")";
      }

    }catch(error){
      video.style.transform = "scale(" + value + ")";
    }
  }

  zoomLevel = value;
  updateZoomUI();
}

function updateZoomUI(){
  zoomText.textContent = "Zoom " + zoomLevel.toFixed(1) + "×";
  zoomOutBtn.disabled = zoomLevel <= 1;
  zoomInBtn.disabled = zoomLevel >= 8;
}

/* =========================================================
   REVERSE GEOCODING
   ========================================================= */

async function reverseGeocode(lat,lon){
  try{
    const url =
      "https://nominatim.openstreetmap.org/reverse" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&zoom=18" +
      "&lat=" + encodeURIComponent(lat) +
      "&lon=" + encodeURIComponent(lon);

    const response = await fetch(url,{
      headers:{Accept:"application/json"}
    });

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();
    const a = data.address || {};

    const fallback = [
      a.road,
      a.neighbourhood,
      a.suburb,
      a.village,
      a.town,
      a.city,
      a.district,
      a.state_district,
      a.state,
      a.postcode,
      a.country
    ].filter(Boolean).join(", ");

    gps.address = data.display_name || fallback || gps.address || "Address unavailable";
    gps.countryCode = String(a.country_code || gps.countryCode || "").toUpperCase();
    gps.countryName = String(a.country || gps.countryName || "").trim();

    if(gps.countryCode){
      const flag = countryFlag(gps.countryCode);
      const country = gps.countryName;
      if(country){
        const escapedCountry = country.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const countryRegex = new RegExp("\\b" + escapedCountry + "\\s*$", "i");
        if(countryRegex.test(gps.address)){
          gps.address = gps.address.replace(countryRegex, country + " " + flag);
        }else if(!gps.address.includes(flag)){
          gps.address = gps.address.replace(/[\\s,]+$/, "") + ", " + country + " " + flag;
        }
      }else if(!gps.address.includes(flag)){
        gps.address = gps.address.replace(/[\\s,]+$/, "") + " " + flag;
      }
    }

    updateLiveOverlay();

  }catch(error){
    console.warn("Reverse geocoding failed:",error);
    setStatus("GPS is working, but address lookup is temporarily unavailable.");
  }
}

/* =========================================================
   GPS
   ========================================================= */

function updateGPSFromPosition(position){
  const coords = position.coords;

  gps.lat = Number(coords.latitude);
  gps.lon = Number(coords.longitude);
  gps.accuracy = Number(coords.accuracy);

  updatePlusCodeFromCurrentGPS();
  updateLiveOverlay();
}

function getGPS(){
  if(!navigator.geolocation){
    setStatus("GPS is not supported by this browser.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async position => {
      updateGPSFromPosition(position);

      const lat = gps.lat;
      const lon = gps.lon;

      await reverseGeocode(lat,lon);

      setStatus(
        "GPS updated: " +
        new Date().toLocaleTimeString()
      );
    },
    error => {
      if(error.code === 1){
        setStatus("Location permission denied. Allow Location access in browser settings.");
      }else if(error.code === 2){
        setStatus("Location unavailable. Trying again...");
      }else if(error.code === 3){
        setStatus("GPS timed out. Trying again...");
      }else{
        setStatus("Unable to get GPS location.");
      }
      updateLiveOverlay();
    },
    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }
  );
}

function getFreshGPS(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error("GPS is not supported."));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async position => {
        updateGPSFromPosition(position);

        try{
          await reverseGeocode(gps.lat,gps.lon);
        }catch(e){}

        resolve(position);
      },
      error => reject(error),
      {
        enableHighAccuracy:true,
        timeout:12000,
        maximumAge:0
      }
    );
  });
}

/* =========================================================
   LIVE OVERLAY
   ========================================================= */

function updateLiveOverlay(){
  if(!stream){
    liveBox.style.display = "none";
    return;
  }

  const now = getDateParts();
  const lines = [
    gps.address || "Waiting for address...",
    gps.plusCode || "—",
    "LATITUDE: " + (gps.lat !== null ? gps.lat.toFixed(6) + "°" : "—") +
      "   |   LONGITUDE: " + (gps.lon !== null ? gps.lon.toFixed(6) + "°" : "—"),
    now.day + " | DATE: " + now.date + " | TIME: " + now.time + " | " + now.gmt,
    "ACCURACY: " + (gps.accuracy !== null ? Math.round(gps.accuracy) + " m" : "—")
  ];

  const extra = additionalInput.value.trim();
  const visitor = visitedInput.value.trim();

  if(extra) lines.push(extra);
  if(visitor) lines.push("Visited By: " + visitor);

  liveLines.innerHTML = lines
    .map(line => '<div class="liveLine">' + escapeHTML(line) + '</div>')
    .join("");

  liveBox.style.display = "block";
}

/* =========================================================
   COMPANY LOGO
   ========================================================= */

function loadLogo(file){
  if(!file) return;

  const reader = new FileReader();

  reader.onload = event => {
    const image = new Image();

    image.onload = () => {
      logoImage = image;
      logoPreview.src = event.target.result;
      logoPreview.style.display = "block";
      setStatus("Company logo loaded.");
      updateLiveOverlay();
    };

    image.src = event.target.result;
  };

  reader.readAsDataURL(file);
}

/* =========================================================
   FINAL PHOTO RENDERER
   ========================================================= */

function capturePhoto(){
  if(!stream || !video.videoWidth || !video.videoHeight){
    setStatus("Camera is not ready. Press READY first.");
    return;
  }

  captureBtn.disabled = true;
  setStatus("Capturing current GPS position...");

  /*
    Get a fresh high-accuracy reading immediately before rendering.
    If it fails, the last valid GPS data is retained.
  */
  getFreshGPS()
    .catch(error => {
      console.warn("Fresh GPS failed; using last valid position.",error);
    })
    .then(() => {
      renderFinalPhoto();
    });
}

function renderFinalPhoto(){
  if(gps.lat !== null && gps.lon !== null){
    gps.plusCode = encodePlusCode(gps.lat,gps.lon);
  }

  const canvas = document.createElement("canvas");
  const sourceW = video.videoWidth;
  const sourceH = video.videoHeight;

  const border = Math.max(6,Math.round(sourceW * 0.006));

  canvas.width = sourceW + border * 2;
  canvas.height = sourceH + border * 2;

  const ctx = canvas.getContext("2d");

  const now = new Date();
  const dateParts = getDateParts(now);

  const address = gps.address || "Address unavailable";
  const plusCode = gps.plusCode || "—";

  const latitude =
    gps.lat !== null ? gps.lat.toFixed(6) + "°" : "—";

  const longitude =
    gps.lon !== null ? gps.lon.toFixed(6) + "°" : "—";

  const accuracy =
    gps.accuracy !== null
      ? Math.round(gps.accuracy) + " m"
      : "—";

  const extra = additionalInput.value.trim();
  const visitor = visitedInput.value.trim();

  const W = canvas.width;
  const H = canvas.height;

  const landscape = W >= H;

  /* Information box dimensions. */
  const panelW = Math.min(
    W - 40,
    W * (landscape ? 0.92 : 0.90)
  );

  const panelX = (W - panelW) / 2;

  const pad = Math.max(
    24,
    Math.round(W * (landscape ? 0.020 : 0.025))
  );

  const contentW = panelW - pad * 2;

  /*
    Font sizes:
    Address is 24pt = 32 CSS/canvas pixels.
    We keep it at 32 unless the photograph itself is unusually small.
  */
  const addressFontSize = 48; // 36pt equivalent at 96 CSS pixels/inch

  let bodySize = Math.max(
    22,
    Math.min(34,Math.round(W * (landscape ? 0.022 : 0.026)))
  );

  const lineGap = Math.max(7,Math.round(bodySize * 0.20));
  const blockGap = Math.max(10,Math.round(bodySize * 0.28));
  const topPadding = Math.max(24,Math.round(bodySize * 0.65));
  const bottomPadding = Math.max(24,Math.round(bodySize * 0.65));

  function bodyFont(size){
    return "bold " + size + "px Georgia,serif";
  }

  /*
    Address and Plus Code are separate blocks.
    Each receives its own calculated vertical position so they
    can never overlap.
  */
  function buildContent(fontSize){
    const normalFont = bodyFont(fontSize);
    const addressFont = bodyFont(addressFontSize);

    const addressLines =
      wrapCanvasText(
        ctx,
        address,
        addressFont,
        contentW
      );

    const plusCodeLines =
      wrapCanvasText(
        ctx,
        plusCode,
        normalFont,
        contentW
      );

    /*
      Latitude and longitude are independent blocks so they can never
      overlap the address or Plus Code.
    */
    const latLonText =
      "LATITUDE: " + latitude + "   |   LONGITUDE: " + longitude;

    /*
      Latitude and Longitude MUST remain on one physical line.
      Dynamically reduce only this line's font size until it fits.
    */
    let latLonFontSize = fontSize;
    let latLonFont = normalFont;

    while (latLonFontSize > 14) {
      latLonFont = bodyFont(latLonFontSize);
      ctx.font = latLonFont;
      if (ctx.measureText(latLonText).width <= contentW) break;
      latLonFontSize--;
    }

    const latLonLines = [latLonText];

    const dateTimeText =
      dateParts.day +
      " | DATE: " + dateParts.date +
      " | TIME: " + dateParts.time +
      " | " + dateParts.gmt;

    const dateTimeLines =
      wrapCanvasText(ctx,dateTimeText,normalFont,contentW);

    const accuracyLines =
      wrapCanvasText(
        ctx,
        "ACCURACY: " + accuracy,
        normalFont,
        contentW
      );

    const blocks = [
      {
        name:"address",
        lines:addressLines,
        size:addressFontSize,
        font:addressFont
      },
      {
        name:"plusCode",
        lines:plusCodeLines,
        size:fontSize,
        font:normalFont
      },
      {
        name:"latLon",
        lines:latLonLines,
        size:latLonFontSize,
        font:latLonFont
      },
      {
        name:"dateTime",
        lines:dateTimeLines,
        size:fontSize,
        font:normalFont
      },
      {
        name:"accuracy",
        lines:accuracyLines,
        size:fontSize,
        font:normalFont
      }
    ];

    if(extra){
      blocks.push({
        name:"additional",
        lines:wrapCanvasText(ctx,extra,normalFont,contentW),
        size:fontSize,
        font:normalFont
      });
    }

    if(visitor){
      blocks.push({
        name:"visited",
        lines:wrapCanvasText(
          ctx,
          "Visited By: " + visitor,
          normalFont,
          contentW
        ),
        size:fontSize,
        font:normalFont
      });
    }

    return blocks;
  }

  function calculateHeight(blocks){
    let height = topPadding;

    for(const block of blocks){
      height +=
        block.lines.length * (block.size + lineGap) +
        blockGap;
    }

    /*
      Logo space is calculated from its actual dimensions.
      No logo = NO logo space.
    */
    if(logoImage){
      const maxW = Math.min(contentW * 0.22,180);
      const maxH = Math.min(H * 0.10,110);

      const scale = Math.min(
        maxW / logoImage.width,
        maxH / logoImage.height,
        1
      );

      const logoH = logoImage.height * scale;

      height += logoH + Math.max(8,blockGap * 0.5);
    }

    height += bottomPadding;

    return height;
  }

  let blocks = buildContent(bodySize);
  let panelH = calculateHeight(blocks);

  /*
    Keep the panel reasonable without making it unnecessarily tall.
    Address remains 24pt unless the source image is genuinely too small.
  */
  const maxPanelH = landscape ? H * 0.70 : H * 0.88;

  while(panelH > maxPanelH && bodySize > 17){
    bodySize--;
    blocks = buildContent(bodySize);
    panelH = calculateHeight(blocks);
  }

  /*
    Panel is anchored to the lower portion of the photograph,
    but its height is ONLY the height actually required.
  */
  const bottomMargin = Math.max(18,Math.round(H * 0.018));
  const panelY = Math.max(
    border + 8,
    H - panelH - bottomMargin
  );

  /* =======================================================
     DRAW ORIGINAL CAMERA IMAGE
     ======================================================= */

  /*
    When visual fallback zoom is active, crop the source image
    around the center so the captured image matches the preview.
  */
  if(zoomLevel <= 1.001){
    ctx.drawImage(
      video,
      border,
      border,
      sourceW,
      sourceH
    );
  }else{
    const z = zoomLevel;

    const cropW = sourceW / z;
    const cropH = sourceH / z;

    const cropX = (sourceW - cropW) / 2;
    const cropY = (sourceH - cropH) / 2;

    ctx.drawImage(
      video,
      cropX,cropY,cropW,cropH,
      border,border,sourceW,sourceH
    );
  }

  /* =======================================================
     DEEP MAROON PHOTO BORDER
     ======================================================= */

  ctx.lineWidth = border;
  ctx.strokeStyle = "#A20404";
  ctx.strokeRect(
    border / 2,
    border / 2,
    W - border,
    H - border
  );

  /* =======================================================
     INFORMATION BOX
     ======================================================= */

  ctx.fillStyle = "rgba(255,255,255,0.50)";
  ctx.beginPath();
  ctx.roundRect(panelX,panelY,panelW,panelH,20);
  ctx.fill();

  ctx.lineWidth = Math.max(2,Math.round(W * 0.002));
  ctx.strokeStyle = "#FBBC09";
  ctx.stroke();

  /* =======================================================
     ALL INFORMATION - ONE CONTINUOUS SECTION
     ======================================================= */

  ctx.fillStyle = "#000";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";

  let y = panelY + topPadding;

  for(const block of blocks){
    ctx.font = block.font;

    for(const line of block.lines){
      y += block.size;
      ctx.fillText(
        line,
        panelX + pad,
        y
      );
      y += lineGap;
    }

    y += blockGap - lineGap;
  }

  /* =======================================================
     COMPANY LOGO
     ======================================================= */

  if(logoImage){
    const maxLogoW = Math.min(contentW * 0.22,180);
    const maxLogoH = Math.min(H * 0.10,110);

    const scale = Math.min(
      maxLogoW / logoImage.width,
      maxLogoH / logoImage.height,
      1
    );

    const logoW = logoImage.width * scale;
    const logoH = logoImage.height * scale;

    /*
      Bottom-right, but only in the space actually required.
      It never creates a large empty panel merely because a logo
      exists.
    */
    const logoX =
      panelX +
      panelW -
      pad -
      logoW;

    const logoY =
      panelY +
      panelH -
      bottomPadding -
      logoH;

    ctx.drawImage(
      logoImage,
      logoX,
      logoY,
      logoW,
      logoH
    );
  }

  /* =======================================================
     JPEG + AUTOMATIC DOWNLOAD
     ======================================================= */

  canvas.toBlob(blob => {
    if(!blob){
      captureBtn.disabled = false;
      setStatus("Could not create the JPG.");
      return;
    }

    if(lastObjectUrl){
      URL.revokeObjectURL(lastObjectUrl);
    }

    lastObjectUrl = URL.createObjectURL(blob);

    preview.src = lastObjectUrl;
    preview.style.display = "block";
    video.style.display = "none";

    const filename =
      "GPS-PHOTO-" +
      now.getFullYear() + "-" +
      String(now.getMonth()+1).padStart(2,"0") + "-" +
      String(now.getDate()).padStart(2,"0") + "-" +
      String(now.getHours()).padStart(2,"0") + "-" +
      String(now.getMinutes()).padStart(2,"0") + "-" +
      String(now.getSeconds()).padStart(2,"0") +
      ".jpg";

    const link = document.createElement("a");
    link.href = lastObjectUrl;
    link.download = filename;
    link.style.display = "none";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setStatus("Photo captured and downloaded automatically.");

    /*
      No RETAKE button.
      No DOWNLOAD button.
      Restart camera automatically.
    */
    setTimeout(async () => {
      const ok = await startCamera();

      captureBtn.disabled = false;

      if(ok){
        getGPS();
        setStatus("Ready for the next photo.");
      }
    },500);

  },"image/jpeg",0.94);
}

/* =========================================================
   EVENTS
   ========================================================= */

readyBtn.addEventListener("click",async()=>{
  if(!isSecure()){
    setStatus("Camera and GPS require HTTPS.");
    $("httpsWarning").classList.remove("hidden");
    return;
  }

  readyBtn.disabled = true;
  readyBtn.textContent = "STARTING...";

  const cameraOK = await startCamera();

  if(!cameraOK){
    readyBtn.disabled = false;
    readyBtn.textContent = "READY";
    return;
  }

  getGPS();

  if(gpsTimer) clearInterval(gpsTimer);

  gpsTimer = setInterval(() => {
    if(stream) getGPS();
  },40000);

  readyBtn.textContent = "READY ✓";
});

switchBtn.addEventListener("click",switchCamera);

zoomInBtn.addEventListener("click",()=>{
  setZoom(zoomLevel + 0.5);
});

zoomOutBtn.addEventListener("click",()=>{
  setZoom(zoomLevel - 0.5);
});

captureBtn.addEventListener("click",capturePhoto);

additionalInput.addEventListener("input",updateLiveOverlay);
visitedInput.addEventListener("input",updateLiveOverlay);

logoInput.addEventListener("change",event=>{
  loadLogo(event.target.files[0]);
});

window.addEventListener("beforeunload",()=>{
  if(gpsTimer) clearInterval(gpsTimer);
  stopCamera();
  if(lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
});
</script>
</body>
</html>
