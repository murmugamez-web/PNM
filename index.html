<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>GPS PHOTO: GEO TAGGING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111;font-family:Arial,sans-serif}
header{background:#fff;padding:14px 16px;border-bottom:1px solid #ddd}
header h1{margin:0;text-align:center;font-size:22px}
main{max-width:1100px;margin:auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
.camera{position:relative;background:#111;border-radius:12px;overflow:hidden;min-height:280px}
#video{display:none;width:100%;height:auto;max-height:80vh;object-fit:contain}
#placeholder{min-height:280px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#ddd;text-align:center}
#placeholder .camicon{font-size:58px}
#preview{display:none;width:100%;height:auto;border:3px solid #A20404}
#liveBox{
 display:none;position:absolute;left:3%;right:3%;bottom:3%;
 background:rgba(255,255,255,.50);border:2px solid #FBBC09;border-radius:14px;
 color:#000;padding:12px;font-family:Georgia,serif;pointer-events:none;
}
.liveTitle{text-align:center;font:bold italic clamp(20px,4vw,34px) Georgia,serif;margin-bottom:10px}
.liveLine{font-weight:700;font-size:clamp(14px,2.4vw,24px);line-height:1.2;margin:4px 0;overflow-wrap:anywhere}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{border:0;border-radius:9px;padding:12px 14px;min-height:44px;font-weight:800;font-size:15px;cursor:pointer}
button:disabled{opacity:.45}
#ready{background:#16a34a;color:white}
#capture{background:#2563eb;color:white}
.secondary{background:#e5e7eb;color:#111}
.zoom{background:#111827;color:white;min-width:48px;font-size:20px}
.zoomText{font-weight:800;align-self:center}
label{display:block;font-weight:800;margin:14px 0 6px}
input[type=text]{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
input[type=file]{width:100%;padding:10px;border:1px dashed #94a3b8;border-radius:9px;background:#f8fafc}
#logoPreview{display:none;max-width:150px;max-height:80px;margin-top:8px;border:1px solid #ccc;border-radius:7px;object-fit:contain}
.status{margin-top:10px;padding:10px;border-radius:8px;background:#f1f5f9;font-size:14px}
.warning{background:#fff7ed;color:#9a3412}
.hidden{display:none!important}
</style>
</head>
<body>

<header><h1>GPS PHOTO: GEO TAGGING</h1></header>

<main>
<div class="card">

<div class="camera">
  <div id="placeholder">
    <div class="camicon">📷</div>
    <h2>GPS PHOTO: GEO TAGGING</h2>
    <p>Press READY to start the camera and GPS.</p>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <img id="preview" alt="Captured GPS photo">

  <div id="liveBox">
    <div id="liveTitle" class="liveTitle">GPS PHOTO: GEO TAGGING 🌐</div>
    <div id="liveLines"></div>
  </div>
</div>

<div class="controls">
  <button id="ready">READY</button>
  <button id="switchCamera" class="secondary hidden">🔄 SWITCH CAMERA</button>
  <button id="zoomOut" class="zoom hidden">−</button>
  <span id="zoomText" class="zoomText hidden">Zoom 1.0×</span>
  <button id="zoomIn" class="zoom hidden">+</button>
  <button id="capture" class="hidden">📸 CAPTURE PHOTO</button>
</div>

<label for="additional">Additional Information</label>
<input id="additional" type="text" placeholder="Enter additional information">

<label for="visitedBy">Visited By</label>
<input id="visitedBy" type="text" placeholder="Enter name">

<label for="logoInput">Company Logo</label>
<input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp">
<img id="logoPreview" alt="Company logo preview">

<div id="status" class="status">Press READY.</div>
<div id="httpsWarning" class="status warning hidden">
Camera and GPS require HTTPS. Publish this index.html on GitHub Pages, Netlify, or another HTTPS host.
</div>

</div>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);

const video=$("video");
const preview=$("preview");
const placeholder=$("placeholder");
const liveBox=$("liveBox");
const liveTitle=$("liveTitle");
const liveLines=$("liveLines");
const ready=$("ready");
const switchCamera=$("switchCamera");
const zoomIn=$("zoomIn");
const zoomOut=$("zoomOut");
const zoomText=$("zoomText");
const capture=$("capture");
const additional=$("additional");
const visitedBy=$("visitedBy");
const logoInput=$("logoInput");
const logoPreview=$("logoPreview");
const status=$("status");

let stream=null;
let gpsTimer=null;
let facingMode="environment";
let zoomLevel=1;
let nativeZoom=false;
let logoImage=null;
let imageUrl=null;

let gps={
  lat:null,
  lon:null,
  accuracy:null,
  address:"—",
  countryCode:"",
  plusCode:"—"
};

function msg(text){status.textContent=text}

function secureContextOK(){
  return window.isSecureContext ||
         location.hostname==="localhost" ||
         location.hostname==="127.0.0.1";
}

if(!secureContextOK()){
  $("httpsWarning").classList.remove("hidden");
}

function countryFlag(code){
  code=String(code||"").toUpperCase();
  if(!/^[A-Z]{2}$/.test(code)) return "🌐";
  return String.fromCodePoint(...[...code].map(c=>127397+c.charCodeAt(0)));
}

function gmtOffset(){
  const offset=-new Date().getTimezoneOffset();
  const sign=offset>=0?"+":"-";
  const abs=Math.abs(offset);
  return "GMT"+sign+
    String(Math.floor(abs/60)).padStart(2,"0")+":"+
    String(abs%60).padStart(2,"0");
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* Open Location Code / Plus Code compatible encoder. */
function makePlusCode(lat,lon){
  lat=Number(lat); lon=Number(lon);
  if(!Number.isFinite(lat)||!Number.isFinite(lon)) return "—";

  const alphabet="23456789CFGHJMPQRVWX";

  lat=Math.max(-90,Math.min(90,lat));
  lon=((lon+180)%360+360)%360-180;

  if(lat===90)lat-=1e-12;

  let latVal=lat+90;
  let lonVal=lon+180;
  const placeValues=[20,1,.05,.0025,.000125];
  let code="";

  for(const p of placeValues){
    const li=Math.max(0,Math.min(19,Math.floor(latVal/p)));
    const lo=Math.max(0,Math.min(19,Math.floor(lonVal/p)));
    code+=alphabet[li]+alphabet[lo];
    latVal-=li*p;
    lonVal-=lo*p;
  }

  return code.slice(0,8)+"+"+code.slice(8);
}

function updateLive(){
  liveTitle.textContent="GPS PHOTO: GEO TAGGING "+countryFlag(gps.countryCode);

  const now=new Date();
  const firstLine =
    '<div class="liveLine"><b>'+esc(gps.plusCode)+'</b> &nbsp; | &nbsp; '+
    esc(gps.address)+'</div>';

  const lines=[
    firstLine,
    '<div class="liveLine">LATITUDE: '+
      esc(gps.lat!==null?gps.lat.toFixed(6):"—")+
      ' &nbsp; | &nbsp; LONGITUDE: '+
      esc(gps.lon!==null?gps.lon.toFixed(6):"—")+
    '</div>',
    '<div class="liveLine">'+
      esc(now.toLocaleDateString(undefined,{weekday:"long"}))+
      ' | DATE: '+esc(now.toLocaleDateString("en-GB"))+
      ' | TIME: '+esc(now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",hour12:true}))+
      ' | '+esc(gmtOffset())+
    '</div>',
    '<div class="liveLine">ACCURACY: '+
      esc(gps.accuracy!==null?Math.round(gps.accuracy)+" m":"—")+
    '</div>'
  ];

  const extra=additional.value.trim();
  const visitor=visitedBy.value.trim();

  if(extra)lines.push('<div class="liveLine">'+esc(extra)+'</div>');
  if(visitor)lines.push('<div class="liveLine">Visited By: '+esc(visitor)+'</div>');

  liveLines.innerHTML=lines.join("");
  liveBox.style.display=stream?"block":"none";
}

function stopCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;
  video.srcObject=null;
  liveBox.style.display="none";
}

async function startCamera(){
  try{
    if(stream)stopCamera();

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:facingMode},
        width:{ideal:1920},
        height:{ideal:1080}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    video.style.display="block";
    preview.style.display="none";
    placeholder.style.display="none";

    switchCamera.classList.remove("hidden");
    zoomIn.classList.remove("hidden");
    zoomOut.classList.remove("hidden");
    zoomText.classList.remove("hidden");
    capture.classList.remove("hidden");

    zoomLevel=1;
    video.style.transform="scale(1)";
    detectZoom();
    updateLive();

    msg("Camera started. GPS refreshes every 40 seconds.");
    return true;

  }catch(e){
    console.error(e);
    if(e.name==="NotAllowedError"){
      msg("Camera permission denied. Allow camera access in browser settings.");
    }else{
      msg("Camera error: "+(e.message||e.name));
    }
    return false;
  }
}

function detectZoom(){
  try{
    const caps=stream?.getVideoTracks()[0]?.getCapabilities?.()||{};
    nativeZoom=!!caps.zoom;
  }catch(e){
    nativeZoom=false;
  }
  updateZoom();
}

function updateZoom(){
  zoomText.textContent="Zoom "+zoomLevel.toFixed(1)+"×";
  zoomOut.disabled=zoomLevel<=1;
  zoomIn.disabled=zoomLevel>=10;
}

async function setZoom(value){
  value=Math.max(1,Math.min(10,value));

  const track=stream?.getVideoTracks?.()[0];

  if(track){
    try{
      const caps=track.getCapabilities?.()||{};

      if(caps.zoom){
        const min=Number(caps.zoom.min??1);
        const max=Math.min(10,Number(caps.zoom.max??10));
        const step=Number(caps.zoom.step??.1);

        value=Math.min(max,Math.max(min,Math.round(value/step)*step));

        await track.applyConstraints({
          advanced:[{zoom:value}]
        });

        nativeZoom=true;
        video.style.transform="scale(1)";
      }else{
        nativeZoom=false;
        video.style.transform="scale("+value+")";
      }
    }catch(e){
      nativeZoom=false;
      video.style.transform="scale("+value+")";
    }
  }

  zoomLevel=value;
  updateZoom();
}

async function switchCameraMode(){
  facingMode=facingMode==="environment"?"user":"environment";
  const ok=await startCamera();

  if(ok){
    getGPS();
    msg(facingMode==="environment"?
      "Rear camera selected.":
      "Front camera selected.");
  }
}

async function reverseGeocode(lat,lon){
  try{
    const url=
      "https://nominatim.openstreetmap.org/reverse"+
      "?format=jsonv2"+
      "&addressdetails=1"+
      "&zoom=18"+
      "&lat="+encodeURIComponent(lat)+
      "&lon="+encodeURIComponent(lon);

    const response=await fetch(url,{
      headers:{Accept:"application/json"}
    });

    if(!response.ok)throw new Error("HTTP "+response.status);

    const data=await response.json();
    const a=data.address||{};

    gps.address=data.display_name||
      [a.road,a.suburb,a.city,a.state,a.postcode,a.country]
      .filter(Boolean).join(", ")||"—";

    gps.countryCode=(a.country_code||"").toUpperCase();

    updateLive();

  }catch(e){
    console.warn("Reverse geocoding failed:",e);
    msg("GPS is working, but address lookup is temporarily unavailable.");
  }
}

function getGPS(){
  if(!navigator.geolocation){
    msg("GPS is not supported by this browser.");
    return;
  }

  navigator.geolocation.getCurrentPosition(async position=>{
    const c=position.coords;

    gps.lat=c.latitude;
    gps.lon=c.longitude;
    gps.accuracy=c.accuracy;
    gps.plusCode=makePlusCode(c.latitude,c.longitude);

    updateLive();

    await reverseGeocode(c.latitude,c.longitude);

    msg("GPS updated: "+new Date().toLocaleTimeString());

  },error=>{
    if(error.code===1){
      msg("Location permission denied. Allow Location access in browser settings.");
    }else if(error.code===2){
      msg("Location unavailable. Trying again...");
    }else if(error.code===3){
      msg("GPS timed out. Trying again...");
    }else{
      msg("Unable to get GPS location.");
    }

    updateLive();

  },{
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:0
  });
}

function loadLogo(file){
  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{
    const img=new Image();

    img.onload=()=>{
      logoImage=img;
      logoPreview.src=e.target.result;
      logoPreview.style.display="block";
      msg("Company logo loaded.");
      updateLive();
    };

    img.src=e.target.result;
  };

  reader.readAsDataURL(file);
}

/* Wrap text using actual canvas measurements. */
function wrapText(ctx,text,font,maxWidth){
  ctx.font=font;

  const words=String(text).split(/\s+/);
  const lines=[];
  let line="";

  for(const word of words){
    const test=line?line+" "+word:word;

    if(ctx.measureText(test).width<=maxWidth){
      line=test;
    }else{
      if(line)lines.push(line);

      if(ctx.measureText(word).width>maxWidth){
        let part="";

        for(const ch of word){
          const candidate=part+ch;

          if(ctx.measureText(candidate).width<=maxWidth){
            part=candidate;
          }else{
            if(part)lines.push(part);
            part=ch;
          }
        }

        line=part;
      }else{
        line=word;
      }
    }
  }

  if(line)lines.push(line);

  return lines;
}

function capturePhoto(){
  if(!stream || !video.videoWidth){
    msg("Camera is not ready. Press READY first.");
    return;
  }

  const canvas=document.createElement("canvas");
  const border=Math.max(8,Math.round(video.videoWidth*.008));
  canvas.width=video.videoWidth+border*2;
  canvas.height=video.videoHeight+border*2;

  const ctx=canvas.getContext("2d");
  const now=new Date();

  const address=gps.address||"—";
  const plus=gps.plusCode||"—";
  const lat=gps.lat!==null?gps.lat.toFixed(6):"—";
  const lon=gps.lon!==null?gps.lon.toFixed(6):"—";
  const accuracy=gps.accuracy!==null?Math.round(gps.accuracy)+" m":"—";

  const day=now.toLocaleDateString(undefined,{weekday:"long"});
  const date=now.toLocaleDateString("en-GB");
  const time=now.toLocaleTimeString([],{
    hour:"numeric",minute:"2-digit",hour12:true
  });
  const zone=gmtOffset();

  const extra=additional.value.trim();
  const visitor=visitedBy.value.trim();
  const landscape=canvas.width>=canvas.height;

  const panelW=landscape?canvas.width*.90:canvas.width*.88;
  const panelX=(canvas.width-panelW)/2;
  const pad=Math.max(24,canvas.width*.025);
  const contentW=panelW-pad*2;

  /* Title gets its own dedicated row. */
  let titleSize=landscape?
    Math.max(38,Math.min(54,canvas.width*.034)):
    Math.max(34,Math.min(48,canvas.width*.040));

  let bodySize=landscape?
    Math.max(22,Math.min(34,canvas.width*.022)):
    Math.max(19,Math.min(30,canvas.width*.026));

  /* 24pt address = 32 CSS pixels at the standard 96dpi canvas scale. */
  const addressSize=32;

  const lineGap=Math.max(7,bodySize*.20);
  const blockGap=Math.max(9,bodySize*.22);
  const titleGap=Math.max(24,bodySize*.70);
  const topPad=Math.max(28,bodySize*.72);
  const bottomPad=Math.max(28,bodySize*.72);
  const rowGap=Math.max(18,bodySize*.45);

  function font(size){
    return "bold "+size+"px Georgia,serif";
  }

  function wrap(text,fontName,maxWidth){
    return wrapText(ctx,text,fontName,maxWidth);
  }

  const title="GPS PHOTO: GEO TAGGING "+countryFlag(gps.countryCode);

  while(titleSize>28){
    ctx.font="bold italic "+titleSize+"px Georgia,serif";
    if(ctx.measureText(title).width<=contentW) break;
    titleSize--;
  }

  /*
    IMPORTANT:
    The Plus Code and Address are deliberately calculated as one row.
    Each cell gets half the available width.
    If either value wraps, its own row height grows automatically.
  */
  const twoColGap=Math.max(18,contentW*.035);
  const cellW=(contentW-twoColGap)/2;

  function buildBlocks(size){
    const bodyFont=font(size);
    const addressFont=font(addressSize);

    const topRow={
      plusLines:wrap(plus,bodyFont,cellW),
      addressLines:wrap(address,addressFont,cellW),
      plusFont:bodyFont,
      addressFont:addressFont,
      plusSize:size,
      addressSize:addressSize
    };

    const blocks=[
      {lines:wrap("LATITUDE: "+lat,bodyFont,contentW),size:size,font:bodyFont},
      {lines:wrap("LONGITUDE: "+lon,bodyFont,contentW),size:size,font:bodyFont},
      {lines:wrap(
        day+" | DATE: "+date+" | TIME: "+time+" | "+zone,
        bodyFont,contentW
      ),size:size,font:bodyFont},
      {lines:wrap("ACCURACY: "+accuracy,bodyFont,contentW),size:size,font:bodyFont}
    ];

    if(extra){
      blocks.push({
        lines:wrap(extra,bodyFont,contentW),
        size:size,font:bodyFont
      });
    }

    if(visitor){
      blocks.push({
        lines:wrap("Visited By: "+visitor,bodyFont,contentW),
        size:size,font:bodyFont
      });
    }

    return {topRow,blocks};
  }

  let layout=buildBlocks(bodySize);

  function lineBlockHeight(b){
    return b.lines.length*(b.size+lineGap)+blockGap;
  }

  function topRowHeight(row){
    const maxLines=Math.max(row.plusLines.length,row.addressLines.length);
    return maxLines*(Math.max(row.plusSize,row.addressSize)+lineGap)+rowGap;
  }

  function totalHeight(l){
    return (
      topPad+
      titleSize+
      titleGap+
      topRowHeight(l.topRow)+
      l.blocks.reduce((sum,b)=>sum+lineBlockHeight(b),0)+
      bottomPad+
      (logoImage?Math.max(70,Math.min(110,canvas.height*.10)):0)
    );
  }

  let panelH=totalHeight(layout);

  const maxPanelH=landscape?canvas.height*.62:canvas.height*.82;

  while(panelH>maxPanelH && bodySize>16){
    bodySize--;
    layout=buildBlocks(bodySize);
    panelH=totalHeight(layout);
  }

  const panelY=canvas.height-panelH-24;

  /* Draw camera image, including visual zoom fallback. */
  if(nativeZoom || zoomLevel<=1){
    ctx.drawImage(
      video,border,border,video.videoWidth,video.videoHeight
    );
  }else{
    const z=zoomLevel;
    const sw=video.videoWidth/z;
    const sh=video.videoHeight/z;

    ctx.drawImage(
      video,
      (video.videoWidth-sw)/2,
      (video.videoHeight-sh)/2,
      sw,sh,
      border,border,
      video.videoWidth,video.videoHeight
    );
  }

  /* Thin deep-maroon photo border. */
  ctx.lineWidth=border;
  ctx.strokeStyle="#A20404";
  ctx.strokeRect(
    border/2,border/2,
    video.videoWidth+border,
    video.videoHeight+border
  );

  /* Information box. */
  ctx.fillStyle="rgba(255,255,255,.50)";
  ctx.beginPath();
  ctx.roundRect(panelX,panelY,panelW,panelH,20);
  ctx.fill();

  ctx.lineWidth=3;
  ctx.strokeStyle="#FBBC09";
  ctx.stroke();

  /* TITLE ROW — completely separated from GPS data. */
  ctx.fillStyle="#000";
  ctx.textAlign="center";
  ctx.font="bold italic "+titleSize+"px Georgia,serif";
  ctx.fillText(
    title,
    panelX+panelW/2,
    panelY+topPad+titleSize
  );

  let y=panelY+topPad+titleSize+titleGap;

  /* PLUS CODE + ADDRESS — same horizontal row. */
  ctx.textAlign="left";

  const leftX=panelX+pad;
  const rightX=leftX+cellW+twoColGap;

  ctx.font=layout.topRow.plusFont;
  let py=y;

  for(const line of layout.topRow.plusLines){
    ctx.fillText(line,leftX,py);
    py+=layout.topRow.plusSize+lineGap;
  }

  ctx.font=layout.topRow.addressFont;
  let ay=y;

  for(const line of layout.topRow.addressLines){
    ctx.fillText(line,rightX,ay);
    ay+=layout.topRow.addressSize+lineGap;
  }

  y+=topRowHeight(layout.topRow);

  /* Remaining GPS/time/additional information — one continuous section. */
  for(const block of layout.blocks){
    ctx.font=block.font;

    for(const line of block.lines){
      ctx.fillText(line,leftX,y);
      y+=block.size+lineGap;
    }

    y+=blockGap;
  }

  /* Company logo remains bottom-right inside the same box. */
  if(logoImage){
    const maxLogoW=Math.min(panelW*.20,180);
    const maxLogoH=Math.min(logoImage?100:0,100);

    const scale=Math.min(
      maxLogoW/logoImage.width,
      maxLogoH/logoImage.height,
      1
    );

    const lw=logoImage.width*scale;
    const lh=logoImage.height*scale;

    const lx=panelX+panelW-pad-lw;
    const ly=panelY+panelH-bottomPad-lh;

    ctx.drawImage(logoImage,lx,ly,lw,lh);
  }

  ctx.textAlign="left";

  canvas.toBlob(blob=>{
    if(!blob){
      msg("Could not create the JPG.");
      return;
    }

    if(imageUrl)URL.revokeObjectURL(imageUrl);
    imageUrl=URL.createObjectURL(blob);

    preview.src=imageUrl;
    preview.style.display="block";
    video.style.display="none";

    stopCamera();

    capture.classList.add("hidden");
    switchCamera.classList.add("hidden");
    zoomIn.classList.add("hidden");
    zoomOut.classList.add("hidden");
    zoomText.classList.add("hidden");

    msg("Photo captured. Downloading automatically.");

    const filename=
      "GPS-PHOTO-PM-"+now.toISOString().slice(0,10)+"-"+
      now.toTimeString().slice(0,8).replace(/:/g,"-")+".jpg";

    const a=document.createElement("a");
    a.href=imageUrl;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();

    /* No RETAKE/DOWNLOAD buttons: automatically restart for next photo. */
    setTimeout(async()=>{
      const ok=await startCamera();
      if(ok){
        getGPS();
        msg("Ready for the next photo.");
      }
    },500);

  },"image/jpeg",.94);
}
/* READY */
ready.addEventListener("click",async()=>{
  if(!secureContextOK()){
    msg("Camera and GPS require HTTPS.");
    return;
  }

  if(!navigator.mediaDevices?.getUserMedia){
    msg("This browser does not support camera access.");
    return;
  }

  ready.disabled=true;
  ready.textContent="STARTING...";

  const ok=await startCamera();

  if(!ok){
    ready.disabled=false;
    ready.textContent="READY";
    return;
  }

  getGPS();

  if(gpsTimer)clearInterval(gpsTimer);
  gpsTimer=setInterval(getGPS,40000);

  ready.textContent="READY ✓";
});

/* Camera switching. */
switchCamera.addEventListener("click",switchCameraMode);

/* Zoom. */
zoomIn.addEventListener("click",()=>setZoom(zoomLevel+.5));
zoomOut.addEventListener("click",()=>setZoom(zoomLevel-.5));

/* Capture. */
capture.addEventListener("click",capturePhoto);

/* Form updates. */
additional.addEventListener("input",updateLive);
visitedBy.addEventListener("input",updateLive);

/* Logo upload. */
logoInput.addEventListener("change",e=>{
  loadLogo(e.target.files[0]);
});

window.addEventListener("beforeunload",()=>{
  if(gpsTimer)clearInterval(gpsTimer);
  stopCamera();
  if(imageUrl)URL.revokeObjectURL(imageUrl);
});
</script>

</body>
</html>
