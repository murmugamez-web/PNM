<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>GPS PHOTO: GEO TAGGING</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f3f4f6;color:#111;font-family:Arial,sans-serif}
header{background:#fff;padding:10px;border-bottom:1px solid #ddd;text-align:center}
header h1{margin:0;font-size:20px}
main{max-width:1100px;margin:auto;padding:12px}
.card{background:#fff;border-radius:15px;padding:12px;box-shadow:0 2px 12px #0001}
.camera{position:relative;background:#111;border-radius:12px;overflow:hidden;min-height:280px;display:flex;align-items:center;justify-content:center}
#placeholder{color:#ddd;text-align:center;padding:25px}
#placeholder .icon{font-size:55px}
#video{display:none;width:100%;height:auto;max-height:78vh;object-fit:contain;background:#000;transform-origin:center center}
.hidden{display:none!important}

#liveMapCard{
 position:absolute;right:3%;top:3%;width:min(34%,220px);min-width:130px;height:105px;
 border-radius:9px;overflow:hidden;background:#222;color:#fff;text-decoration:none;
 box-shadow:0 3px 12px #0008;z-index:5
}
.mapThumb{position:absolute;inset:0;background:linear-gradient(35deg,transparent 45%,#c9d2c0 46% 49%,transparent 50%),linear-gradient(145deg,transparent 55%,#d8cbb5 56% 59%,transparent 60%),#b9c9ad}
.mapGrid{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 24%,#e7e1d5 25% 27%,transparent 28% 59%,#e7e1d5 60% 62%,transparent 63%),linear-gradient(0deg,transparent 0 28%,#e7e1d5 29% 31%,transparent 32% 68%,#e7e1d5 69% 71%,transparent 72%);opacity:.8}
.mapRoad{position:absolute;background:#fff;height:6px;border-radius:10px;box-shadow:0 0 0 1px #c9c1b2}
.road1{width:150%;left:-20%;top:48%;transform:rotate(-15deg)}
.road2{width:120%;left:-10%;top:25%;transform:rotate(28deg)}
.road3{width:100%;left:10%;top:72%;transform:rotate(7deg)}
.mapPin{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-45deg);width:24px;height:24px;border-radius:50% 50% 50% 0;background:#e11d48;border:3px solid #fff;box-shadow:0 2px 5px #0008}
.mapPin:after{content:"";position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;left:6px;top:6px}
.mapCaption{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;background:#111c;font-size:12px;font-weight:800;text-align:center}

#mapBadge{
 position:absolute;right:3%;background:#242424;color:#fff;padding:6px 9px;border-radius:7px;
 font-size:12px;font-weight:800;z-index:6;box-shadow:0 2px 8px #0007;display:flex;align-items:center;gap:6px
}
#liveMapCard+#mapBadge{top:calc(3% + 112px)}
.badgeLogo{width:20px;height:20px;border-radius:4px;background:#fbbc09}

#liveBox{
 display:none;position:absolute;left:3%;right:3%;bottom:3%;
 background:rgba(255,255,255,.50);border:2px solid #FBBC09;border-radius:12px;
 padding:9px;color:#000;font-family:Georgia,"Times New Roman",serif;pointer-events:none
}
.liveLine{font-weight:700;font-size:20px;line-height:1.15;margin:3px 0;text-align:center;overflow:hidden}

.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:12px}
button{
 border:0;border-radius:9px;padding:8px;min-height:46px;min-width:52px;width:52px;
 font-weight:800;font-size:24px;line-height:1;cursor:pointer
}
button:disabled{opacity:.45}
#ready{background:#16a34a;color:#fff}
#capture{background:#2563eb;color:#fff}
.secondary{background:#e5e7eb}
.zoom{background:#111827;color:#fff}
.zoomText{align-self:center;font-weight:800;min-width:44px;text-align:center}

label{display:block;font-weight:800;margin:14px 0 6px}
input[type=text],input[type=file]{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
input[type=file]{background:#f8fafc}
#logoPreview{display:none;max-width:150px;max-height:80px;margin-top:7px;border:1px solid #bbb;border-radius:6px}
#status{margin-top:10px;background:#f1f5f9;padding:10px;border-radius:8px;font-size:14px}
.warning{background:#fff7ed!important;color:#9a3412}

@media(max-width:600px){
 #liveMapCard{width:34vw;min-width:115px;height:82px}
 #liveMapCard+#mapBadge{top:calc(3% + 88px);font-size:10px;padding:5px 7px}
 .liveLine{font-size:15px}
}
</style>
</head>
<body>
<header><h1>GPS PHOTO: GEO TAGGING</h1></header>

<main>
<div class="card">
 <div class="camera">
  <div id="placeholder">
   <div class="icon">📷</div>
   <h2>GPS PHOTO: GEO TAGGING</h2>
   <p>Press ▶️ to start.</p>
  </div>

  <video id="video" autoplay muted playsinline></video>

  <a id="liveMapCard" class="hidden" href="#" target="_blank" rel="noopener"
     aria-label="Open current location in Google Maps">
   <div class="mapThumb">
    <div class="mapGrid"></div>
    <div class="mapRoad road1"></div>
    <div class="mapRoad road2"></div>
    <div class="mapRoad road3"></div>
    <div class="mapPin"></div>
   </div>
   <div class="mapCaption">📍 Google Maps</div>
  </a>

  <div id="mapBadge" class="hidden"><span>📷</span><span>PM Geotag Photo</span></div>
  <div id="liveBox"><div id="liveLines"></div></div>
 </div>

 <div class="controls">
  <button id="ready" aria-label="Ready" title="Ready">▶️</button>
  <button id="switchCamera" class="secondary hidden" aria-label="Switch camera" title="Switch camera">🔄</button>
  <button id="zoomOut" class="zoom hidden" aria-label="Zoom out" title="Zoom out">➖</button>
  <span id="zoomText" class="zoomText hidden" aria-hidden="true">1.0×</span>
  <button id="zoomIn" class="zoom hidden" aria-label="Zoom in" title="Zoom in">➕</button>
  <button id="flash" class="zoom hidden" aria-label="Flashlight: off" title="Flashlight: off">🔦</button>
  <button id="capture" class="hidden" aria-label="Capture photo" title="Capture photo">📸</button>
 </div>

 <label for="additional">Additional Information</label>
 <input id="additional" type="text" placeholder="Enter additional information">

 <label for="visited">Visited By</label>
 <input id="visited" type="text" placeholder="Enter name">

 <label for="logo">Company Logo</label>
 <input id="logo" type="file" accept="image/png,image/jpeg,image/webp">
 <img id="logoPreview" alt="Logo preview">

 <div id="status">Press ▶️.</div>
 <div id="httpsWarning" class="warning hidden">
  Camera and GPS require HTTPS. Publish this index.html on GitHub Pages, Netlify, or another HTTPS host.
 </div>
</div>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);

const video=$("video"),placeholder=$("placeholder"),liveBox=$("liveBox"),liveLines=$("liveLines");
const liveMapCard=$("liveMapCard"),mapBadge=$("mapBadge");
const ready=$("ready"),switchCamera=$("switchCamera");
const zoomOut=$("zoomOut"),zoomIn=$("zoomIn"),zoomText=$("zoomText"),flash=$("flash"),capture=$("capture");
const additional=$("additional"),visited=$("visited"),logo=$("logo"),logoPreview=$("logoPreview");
const status=$("status"),httpsWarning=$("httpsWarning");

let stream=null;
let gpsTimer=null;
let facing="environment";
let zoom=1;
let flashMode="off"; // off, on, auto
let flashSupported=false;
let outputRotation=0;
let deviceAngle=0;
let motionPermissionRequested=false;
let logoImage=null;
let lastObjectUrl=null;
let wasCameraActive=false;

const gps={
 lat:null,lon:null,accuracy:null,address:"",
 countryCode:"",countryName:"",plusCode:""
};

function isSecure(){
 return window.isSecureContext ||
        location.hostname==="localhost" ||
        location.hostname==="127.0.0.1";
}

if(!isSecure()) httpsWarning.classList.remove("hidden");

function setStatus(text){status.textContent=text}

function countryFlag(code){
 code=String(code||"").toUpperCase();
 if(!/^[A-Z]{2}$/.test(code)) return "";
 return String.fromCodePoint(...[...code].map(c=>127397+c.charCodeAt(0)));
}

function getGMTOffset(d=new Date()){
 const minutes=-d.getTimezoneOffset();
 const sign=minutes>=0?"+":"-";
 const a=Math.abs(minutes);
 return "GMT"+sign+
   String(Math.floor(a/60)).padStart(2,"0")+":"+
   String(a%60).padStart(2,"0");
}

function dateTimeInfo(){
 const d=new Date();
 return {
  day:d.toLocaleDateString(undefined,{weekday:"long"}),
  date:d.toLocaleDateString("en-GB"),
  time:d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",hour12:true}),
  gmt:getGMTOffset(d)
 };
}

/* Local Open Location Code / Plus Code generator */
function generatePlusCode(lat,lon){
 const alphabet="23456789CFGHJMPQRVWX";
 lat=Number(lat);lon=Number(lon);

 if(!Number.isFinite(lat)||!Number.isFinite(lon)) return "";

 lat=Math.max(-90,Math.min(90,lat));
 lon=((lon+180)%360+360)%360-180;

 if(lat===90) lat-=1e-12;

 lat+=90;
 lon+=180;

 const values=[20,1,.05,.0025,.000125];
 let code="";

 for(const v of values){
  const a=Math.max(0,Math.min(19,Math.floor(lat/v)));
  const b=Math.max(0,Math.min(19,Math.floor(lon/v)));
  code+=alphabet[a]+alphabet[b];
  lat-=a*v;
  lon-=b*v;
 }

 return code.slice(0,8)+"+"+code.slice(8,10);
}

function wrapText(ctx,text,font,maxWidth){
 ctx.font=font;
 const words=String(text||"").trim().split(/\s+/);
 if(!words.length||!words[0]) return [];

 const lines=[];
 let line="";

 for(const word of words){
  const candidate=line?line+" "+word:word;

  if(ctx.measureText(candidate).width<=maxWidth){
   line=candidate;
   continue;
  }

  if(line) lines.push(line);
  line="";

  if(ctx.measureText(word).width<=maxWidth){
   line=word;
  }else{
   let piece="";
   for(const ch of word){
    if(ctx.measureText(piece+ch).width<=maxWidth){
     piece+=ch;
    }else{
     if(piece) lines.push(piece);
     piece=ch;
    }
   }
   line=piece;
  }
 }

 if(line) lines.push(line);
 return lines;
}

function stopCamera(){
 if(stream){
  stream.getTracks().forEach(track=>track.stop());
 }
 stream=null;
 video.srcObject=null;
 liveBox.style.display="none";
}

async function startCamera(){
 try{
  if(!navigator.mediaDevices?.getUserMedia){
   setStatus("Camera is not supported by this browser.");
   return false;
  }

  stopCamera();

  stream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:{ideal:facing},
    width:{ideal:1920},
    height:{ideal:1080}
   },
   audio:false
  });

  video.srcObject=stream;
  await video.play();

  placeholder.style.display="none";
  video.style.display="block";
  liveBox.style.display="block";

  switchCamera.classList.remove("hidden");
  zoomOut.classList.remove("hidden");
  zoomIn.classList.remove("hidden");
  zoomText.classList.remove("hidden");
  flash.classList.remove("hidden");
  capture.classList.remove("hidden");

  zoom=1;
  video.style.transform="scale(1)";
  updateZoomUI();

  const cameraTrack=stream?.getVideoTracks?.()[0];
  flashSupported=!!(cameraTrack?.getCapabilities?.().torch);
  await applyFlashMode();

  updateLiveOverlay();

  wasCameraActive=true;
  return true;

 }catch(e){
  if(e.name==="NotAllowedError"){
   setStatus("Camera permission denied. Allow camera access in browser settings.");
  }else{
   setStatus("Camera error: "+(e.message||e.name));
  }
  return false;
 }
}

async function switchCameraMode(){
 facing=facing==="environment"?"user":"environment";
 await startCamera();
 getGPS();
}

function normalizeOrientationAngle(a){
 a=((Number(a)||0)%360+360)%360;
 if(a<45||a>=315) return 0;
 if(a<135) return 90;
 if(a<225) return 180;
 return 270;
}

function updateOrientationFromScreen(){
 try{
  if(screen.orientation &&
     Number.isFinite(screen.orientation.angle)){
   deviceAngle=normalizeOrientationAngle(screen.orientation.angle);
   outputRotation=deviceAngle;
   updateLiveOverlay();
  }
 }catch{}
}

function handleDeviceOrientation(e){
 const beta=Number(e.beta);
 const gamma=Number(e.gamma);

 if(!Number.isFinite(beta)||!Number.isFinite(gamma)) return;

 let angle=deviceAngle;

 if(Math.abs(gamma)>35){
  angle=gamma>0?90:270;
 }else if(Math.abs(beta)>135){
  angle=180;
 }else{
  angle=0;
 }

 if(angle!==deviceAngle){
  deviceAngle=angle;
  outputRotation=angle;
  updateLiveOverlay();
 }
}

async function startAutomaticOrientation(){
 if(motionPermissionRequested) return;

 motionPermissionRequested=true;

 try{
  if(typeof DeviceOrientationEvent!=="undefined" &&
     typeof DeviceOrientationEvent.requestPermission==="function"){

   const result=await DeviceOrientationEvent.requestPermission();

   if(result!=="granted"){
    setStatus("Motion permission was not granted. Automatic photo orientation may be unavailable.");
    return;
   }
  }
 }catch{}

 try{
  window.addEventListener("deviceorientation",handleDeviceOrientation,true);

  if(screen.orientation){
   screen.orientation.addEventListener("change",updateOrientationFromScreen);
  }

  window.addEventListener("orientationchange",updateOrientationFromScreen);
 }catch{}

 updateOrientationFromScreen();
}

async function setZoom(value){
 value=Math.max(1,Math.min(8,value));

 const track=stream?.getVideoTracks?.()[0];

 if(track){
  try{
   const capabilities=track.getCapabilities?.()||{};

   if(capabilities.zoom){
    const min=Number(capabilities.zoom.min??1);
    const max=Math.min(8,Number(capabilities.zoom.max??8));
    const step=Number(capabilities.zoom.step??.1);

    value=Math.min(
     max,
     Math.max(min,Math.round(value/step)*step)
    );

    await track.applyConstraints({
     advanced:[{zoom:value}]
    });

    video.style.transform="scale(1)";
   }else{
    video.style.transform="scale("+value+")";
   }

  }catch{
   video.style.transform="scale("+value+")";
  }
 }

 zoom=value;
 updateZoomUI();
}

function updateZoomUI(){
 zoomText.textContent=zoom.toFixed(1)+"×";
 zoomOut.disabled=zoom<=1;
 zoomIn.disabled=zoom>=8;
}


function updateFlashUI(){
 if(!flash)return;

 const labels={
  off:"Flashlight: off",
  on:"Flashlight: on",
  auto:"Flashlight: auto"
 };

 const icons={
  off:"🔦",
  on:"💡",
  auto:"🔆"
 };

 flash.textContent=icons[flashMode];
 flash.title=labels[flashMode];
 flash.setAttribute("aria-label",labels[flashMode]);

 if(!flashSupported){
  flash.disabled=true;
  flash.title="Flashlight not supported by this camera/browser";
  flash.setAttribute("aria-label",flash.title);
 }else{
  flash.disabled=false;
 }
}

async function applyFlashMode(){
 const track=stream?.getVideoTracks?.()[0];

 if(!track){
  flashSupported=false;
  updateFlashUI();
  return;
 }

 const capabilities=track.getCapabilities?.()||{};
 flashSupported=!!capabilities.torch;

 if(!flashSupported){
  updateFlashUI();
  return;
 }

 try{
  /*
   * Browser camera torch support uses the MediaStreamTrack torch
   * constraint. "Auto" is represented by torch=false because
   * browsers generally expose only on/off torch control; the
   * camera itself remains responsible for its automatic exposure.
   */
  const torch=flashMode==="on";
  await track.applyConstraints({
   advanced:[{torch:torch}]
  });
 }catch(e){
  setStatus("Flashlight mode is not supported by this camera/browser.");
 }

 updateFlashUI();
}

async function cycleFlash(){
 if(!stream){
  setStatus("Start the camera first.");
  return;
 }

 flashMode =
  flashMode==="off" ? "on" :
  flashMode==="on" ? "auto" :
  "off";

 await applyFlashMode();
}

async function reverseGeocode(lat,lon){
 try{
  const url=
   "https://nominatim.openstreetmap.org/reverse"+
   "?format=jsonv2&addressdetails=1&zoom=18"+
   "&lat="+encodeURIComponent(lat)+
   "&lon="+encodeURIComponent(lon);

  const response=await fetch(url,{
   headers:{Accept:"application/json"}
  });

  if(!response.ok) throw Error("HTTP "+response.status);

  const data=await response.json();
  const a=data.address||{};

  const first=(...values)=>{
   for(const value of values){
    const s=String(value||"").trim();
    if(s) return s;
   }
   return "";
  };

  const add=(arr,value)=>{
   value=String(value||"").trim();
   if(value &&
      !arr.some(x=>x.toLowerCase()===value.toLowerCase())){
    arr.push(value);
   }
  };

  const road=first(
   a.road,
   a.residential,
   a.pedestrian,
   a.footway,
   a.path,
   a.cycleway
  );

  /*
   * Explicit address order:
   * Road/Main Road + locality + district + state + PIN + country.
   *
   * If a road is unavailable, use the most useful available
   * locality/area as the first component rather than leaving
   * an empty road field.
   */
  const locality=first(
   a.locality,
   a.neighbourhood,
   a.suburb,
   a.hamlet,
   a.village,
   a.town,
   a.city
  );

  const district=first(
   a.city_district,
   a.district,
   a.county,
   a.state_district
  );

  const state=first(a.state);
  const pin=first(a.postcode);
  const country=first(a.country);

  gps.countryCode=String(
   a.country_code||gps.countryCode||""
  ).toUpperCase();

  gps.countryName=country||gps.countryName||"";

  const countryDisplay=country
   ? ((countryFlag(gps.countryCode)||"")+" "+country).trim()
   : "";

  const parts=[];

  if(road){
   add(parts,road);
  }else{
   /*
    * Proper fallback when no road is returned:
    * use locality first, then district, so the address
    * still starts with a meaningful geographic name.
    */
   add(parts,locality);
  }

  /*
   * If road exists, locality follows it.
   * If road was absent, locality may already be first.
   */
  if(road)add(parts,locality);

  add(parts,district);
  add(parts,state);
  add(parts,pin);
  add(parts,countryDisplay);

  gps.address=parts.join(", ") ||
              data.display_name ||
              "Address unavailable";

  updateLiveOverlay();

 }catch{
  setStatus(
   "GPS is working, but address lookup is temporarily unavailable."
  );
 }
}

function applyPosition(position){
 gps.lat=position.coords.latitude;
 gps.lon=position.coords.longitude;
 gps.accuracy=position.coords.accuracy;
 gps.plusCode=generatePlusCode(gps.lat,gps.lon);
 updateLiveOverlay();
}

function getGPS(){
 if(!navigator.geolocation){
  setStatus("Geolocation is not supported by this browser.");
  return;
 }

 navigator.geolocation.getCurrentPosition(
  position=>{
   applyPosition(position);
   reverseGeocode(position.coords.latitude,position.coords.longitude);
   setStatus("GPS updated.");
  },
  error=>{
   if(error.code===1){
    setStatus(
     "Location permission denied. Allow Location access in browser settings."
    );
   }else{
    setStatus(
     "GPS temporarily unavailable. Keeping the last valid position."
    );
   }
  },
  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:0
  }
 );
}

function freshGPS(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation){
   reject(Error("No geolocation"));
   return;
  }

  navigator.geolocation.getCurrentPosition(
   position=>{
    applyPosition(position);
    reverseGeocode(
     position.coords.latitude,
     position.coords.longitude
    );
    resolve(position);
   },
   reject,
   {
    enableHighAccuracy:true,
    timeout:12000,
    maximumAge:0
   }
  );
 });
}

function updateGoogleMapCard(){
 if(gps.lat==null||gps.lon==null){
  liveMapCard.classList.add("hidden");
  mapBadge.classList.add("hidden");
  return;
 }

 liveMapCard.href=
  "https://www.google.com/maps/search/?api=1&query="+
  encodeURIComponent(gps.lat+","+gps.lon);

 liveMapCard.classList.remove("hidden");
 mapBadge.classList.remove("hidden");
}

function escapeHTML(text){
 return String(text).replace(/[&<>"]/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;"
 }[c]));
}

function updateLiveOverlay(){
 if(!stream) return;

 const t=dateTimeInfo();

 const lines=[
  gps.address||"Waiting for address...",
  gps.plusCode||"—",
  "LATITUDE: "+
   (gps.lat==null?"—":gps.lat.toFixed(6)+"°")+
   "   |   LONGITUDE: "+
   (gps.lon==null?"—":gps.lon.toFixed(6)+"°"),
  t.day+" | DATE: "+t.date+" | TIME: "+t.time+" | "+t.gmt,
  "ACCURACY: "+
   (gps.accuracy==null?"—":Math.round(gps.accuracy)+" m")
 ];

 if(additional.value.trim()){
  lines.push(additional.value.trim());
 }

 if(visited.value.trim()){
  lines.push("Visited By: "+visited.value.trim());
 }

 liveLines.innerHTML=lines.map(line=>
  "<div class='liveLine'>"+escapeHTML(line)+"</div>"
 ).join("");

 updateGoogleMapCard();
}

logo.addEventListener("change",()=>{
 const file=logo.files?.[0];

 if(!file){
  logoImage=null;
  logoPreview.style.display="none";
  return;
 }

 const reader=new FileReader();

 reader.onload=e=>{
  const image=new Image();

  image.onload=()=>{
   logoImage=image;
   logoPreview.src=e.target.result;
   logoPreview.style.display="block";
  };

  image.src=e.target.result;
 };

 reader.readAsDataURL(file);
});

additional.addEventListener("input",updateLiveOverlay);
visited.addEventListener("input",updateLiveOverlay);

function roundedRect(ctx,x,y,w,h,r){
 r=Math.min(r,w/2,h/2);
 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);
 ctx.arcTo(x,y,x+w,y,r);
 ctx.closePath();
}

/* The same PM Geotag Photo badge is rendered on the canvas/JPG. */
function drawPMBrandBadge(ctx,x,y,w,h){
 ctx.save();

 roundedRect(ctx,x,y,w,h,Math.min(12,h/3));
 ctx.fillStyle="rgba(20,20,20,.88)";
 ctx.fill();

 const iconSize=Math.min(h-10,44);
 const ix=x+8;
 const iy=y+(h-iconSize)/2;

 roundedRect(ctx,ix,iy,iconSize,iconSize,5);
 ctx.fillStyle="#0ea5e9";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(
  ix+iconSize*.5,
  iy+iconSize*.52,
  iconSize*.25,
  0,
  Math.PI*2
 );
 ctx.fillStyle="#fbbc09";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(
  ix+iconSize*.5,
  iy+iconSize*.52,
  iconSize*.11,
  0,
  Math.PI*2
 );
 ctx.fillStyle="#111827";
 ctx.fill();

 ctx.beginPath();
 ctx.arc(
  ix+iconSize*.73,
  iy+iconSize*.30,
  iconSize*.12,
  0,
  Math.PI*2
 );
 ctx.fillStyle="#ef233c";
 ctx.fill();

 ctx.fillStyle="#fff";
 ctx.font="bold "+
  Math.max(16,Math.round(h*.38))+
  "px Arial,sans-serif";

 ctx.textAlign="left";
 ctx.textBaseline="middle";
 ctx.fillText(
  "PM Geotag Photo",
  ix+iconSize+9,
  y+h/2
 );

 ctx.restore();
}

async function capturePhoto(){
 if(!stream||!video.videoWidth){
  setStatus("Camera is not ready.");
  return;
 }

 capture.disabled=true;
 setStatus("Getting current GPS position...");

 try{
  await freshGPS();
 }catch{}

 renderFinalPhoto();
}

function renderFinalPhoto(){
 if(gps.lat!=null&&gps.lon!=null){
  gps.plusCode=generatePlusCode(gps.lat,gps.lon);
 }

 const sourceW=video.videoWidth;
 const sourceH=video.videoHeight;

 const border=Math.max(
  6,
  Math.round(Math.max(sourceW,sourceH)*.006)
 );

 const rotated=
  outputRotation===90||outputRotation===270;

 const photoW=rotated?sourceH:sourceW;
 const photoH=rotated?sourceW:sourceH;

 const W=photoW+border*2;
 const H=photoH+border*2;

 const canvas=document.createElement("canvas");
 canvas.width=W;
 canvas.height=H;

 const ctx=canvas.getContext("2d");

 /* Draw the camera frame with automatic orientation. */
 ctx.save();

 if(outputRotation===90){
  ctx.translate(W,0);
  ctx.rotate(Math.PI/2);
 }else if(outputRotation===180){
  ctx.translate(W,H);
  ctx.rotate(Math.PI);
 }else if(outputRotation===270){
  ctx.translate(0,H);
  ctx.rotate(-Math.PI/2);
 }

 if(zoom<=1.001){
  ctx.drawImage(
   video,
   border,
   border,
   sourceW,
   sourceH
  );
 }else{
  const cropW=sourceW/zoom;
  const cropH=sourceH/zoom;
  const cropX=(sourceW-cropW)/2;
  const cropY=(sourceH-cropH)/2;

  ctx.drawImage(
   video,
   cropX,cropY,cropW,cropH,
   border,border,sourceW,sourceH
  );
 }

 ctx.restore();

 /* Deep-maroon photo border. */
 ctx.lineWidth=border;
 ctx.strokeStyle="#A20404";
 ctx.strokeRect(
  border/2,
  border/2,
  W-border,
  H-border
 );

 /*
  Dynamic information-box renderer.
  The box is 2.5% from the bottom and every text block
  receives its own calculated height.
 */
 const panelW=Math.min(W-40,W*.92);
 const panelX=(W-panelW)/2;

 const pad=Math.max(22,Math.round(W*.025));
 const contentW=panelW-pad*2;

 const addressSize=48; // approximately 36pt at 96 CSS px/in conversion
 const bodySize=32;
 const gap=Math.max(7,Math.round(bodySize*.18));
 const blockGap=Math.max(10,Math.round(bodySize*.28));
 const topPad=Math.max(22,Math.round(bodySize*.7));
 const bottomPad=Math.max(22,Math.round(bodySize*.6));

 const addressFont=
  "bold "+addressSize+"px Georgia,serif";

 const bodyFont=size=>
  "bold "+size+"px Georgia,serif";

 const addressLines=wrapText(
  ctx,
  gps.address||"Address unavailable",
  addressFont,
  contentW
 );

 const plusLines=wrapText(
  ctx,
  gps.plusCode||"—",
  bodyFont(bodySize),
  contentW
 );

 /* Force Latitude + Longitude to one physical line. */
 const latLonText=
  "LATITUDE: "+
  (gps.lat==null?"—":gps.lat.toFixed(6)+"°")+
  "   |   LONGITUDE: "+
  (gps.lon==null?"—":gps.lon.toFixed(6)+"°");

 let latLonSize=bodySize;

 while(latLonSize>10){
  ctx.font=bodyFont(latLonSize);

  if(ctx.measureText(latLonText).width<=contentW){
   break;
  }

  latLonSize--;
 }

 /* Force Day + Date + Time + GMT to one physical line. */
 const t=dateTimeInfo();

 const dateTimeText=
  t.day+
  " | DATE: "+t.date+
  " | TIME: "+t.time+
  " | "+t.gmt;

 let dateTimeSize=bodySize;

 while(dateTimeSize>10){
  ctx.font=bodyFont(dateTimeSize);

  if(ctx.measureText(dateTimeText).width<=contentW){
   break;
  }

  dateTimeSize--;
 }

 const accuracyText=
  "ACCURACY: "+
  (gps.accuracy==null?"—":Math.round(gps.accuracy)+" m");

 const extra=additional.value.trim();
 const visitor=visited.value.trim();

 const extraLines=extra?
  wrapText(ctx,extra,bodyFont(bodySize),contentW):[];

 const visitorLines=visitor?
  wrapText(
   ctx,
   "Visited By: "+visitor,
   bodyFont(bodySize),
   contentW
  ):[];

 /* Reserve only actual logo space. */
 let logoW=0;
 let logoH=0;

 if(logoImage){
  const maxW=Math.min(contentW*.22,180);
  const maxH=Math.min(H*.10,110);

  const scale=Math.min(
   maxW/logoImage.width,
   maxH/logoImage.height,
   1
  );

  logoW=logoImage.width*scale;
  logoH=logoImage.height*scale;
 }

 const brandH=Math.max(
  42,
  Math.round(bodySize*1.35)
 );

 const brandW=Math.min(
  Math.max(190,Math.round(W*.24)),
  W*.38
 );

 function blockHeight(lines,size,spacing,extraHeight){
  if(!lines.length)return 0;
  return lines.length*size+
         (lines.length-1)*spacing+
         extraHeight;
 }

 let panelH=
  topPad+
  blockHeight(addressLines,addressSize,gap,blockGap)+
  blockHeight(plusLines,bodySize,gap,blockGap)+
  latLonSize+blockGap+
  dateTimeSize+blockGap+
  blockHeight([accuracyText],bodySize,gap,blockGap);

 if(extraLines.length){
  panelH+=blockHeight(
   extraLines,
   bodySize,
   gap,
   blockGap
  );
 }

 if(visitorLines.length){
  panelH+=blockHeight(
   visitorLines,
   bodySize,
   gap,
   blockGap
  );
 }

 if(logoImage){
  panelH+=logoH+
    Math.round(blockGap*.5);
 }

 panelH+=bottomPad;

 panelH=Math.min(
  panelH,
  H-border*2-16
 );

 const bottomGap=Math.max(18,H*.025);

 const panelY=Math.max(
  border+8,
  H-panelH-bottomGap
 );

 const brandX=panelX+panelW-brandW;
 const brandY=Math.max(
  border+6,
  panelY-brandH-8
 );

 /* Information box. */
 ctx.fillStyle="rgba(255,255,255,.50)";

 roundedRect(
  ctx,
  panelX,
  panelY,
  panelW,
  panelH,
  20
 );

 ctx.fill();

 ctx.lineWidth=Math.max(
  2,
  Math.round(W*.002)
 );

 ctx.strokeStyle="#FBBC09";
 ctx.stroke();

 /* Badge right edge exactly aligns with information box. */
 drawPMBrandBadge(
  ctx,
  brandX,
  brandY,
  brandW,
  brandH
 );

 /* All final text is centered. */
 ctx.fillStyle="#000";
 ctx.textAlign="center";
 ctx.textBaseline="alphabetic";

 const centerX=panelX+panelW/2;
 let y=panelY+topPad;

 function drawLines(lines,font,size){
  ctx.font=font;

  for(const line of lines){
   y+=size;
   ctx.fillText(line,centerX,y);
   y+=gap;
  }

  y+=blockGap-gap;
 }

 /* Address: 36pt-equivalent large canvas font. */
 drawLines(
  addressLines,
  addressFont,
  addressSize
 );

 /* Plus Code separate from address. */
 drawLines(
  plusLines,
  bodyFont(bodySize),
  bodySize
 );

 /* Latitude + Longitude: one physical line. */
 ctx.font=bodyFont(latLonSize);
 y+=latLonSize;
 ctx.fillText(latLonText,centerX,y);
 y+=blockGap;

 /* Day + Date + Time + GMT: one physical line. */
 ctx.font=bodyFont(dateTimeSize);
 y+=dateTimeSize;
 ctx.fillText(dateTimeText,centerX,y);
 y+=blockGap;

 /* Accuracy. */
 drawLines(
  [accuracyText],
  bodyFont(bodySize),
  bodySize
 );

 /* Additional information. */
 if(extraLines.length){
  drawLines(
   extraLines,
   bodyFont(bodySize),
   bodySize
  );
 }

 /* Visited By. */
 if(visitorLines.length){
  drawLines(
   visitorLines,
   bodyFont(bodySize),
   bodySize
  );
 }

 /*
  Company logo is bottom-right.
  It does not change text alignment and only consumes
  its actual required area.
 */
 if(logoImage){
  const lx=
   panelX+
   panelW-
   pad-
   logoW;

  const ly=
   panelY+
   panelH-
   bottomPad-
   logoH;

  ctx.drawImage(
   logoImage,
   lx,
   ly,
   logoW,
   logoH
  );
 }

 canvas.toBlob(blob=>{
  if(!blob){
   setStatus("Could not create JPG.");
   capture.disabled=false;
   return;
  }

  if(lastObjectUrl){
   URL.revokeObjectURL(lastObjectUrl);
  }

  lastObjectUrl=URL.createObjectURL(blob);

  const a=document.createElement("a");
  const d=new Date();

  a.href=lastObjectUrl;

  a.download=
   "GPS-PHOTO-"+
   d.getFullYear()+"-"+
   String(d.getMonth()+1).padStart(2,"0")+"-"+
   String(d.getDate()).padStart(2,"0")+"-"+
   String(d.getHours()).padStart(2,"0")+"-"+
   String(d.getMinutes()).padStart(2,"0")+"-"+
   String(d.getSeconds()).padStart(2,"0")+
   ".jpg";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setStatus("Photo captured and downloaded automatically.");

  /*
   Restart the camera after capture so the user can immediately
   capture another photo. GPS continues independently.
  */
  setTimeout(async()=>{
   const currentFacing=facing;
   const currentZoom=zoom;

   const ok=await startCamera();

   facing=currentFacing;

   if(ok){
    await setZoom(currentZoom);
    getGPS();
    setStatus("Ready for the next photo.");
   }

   capture.disabled=false;
  },500);

 },"image/jpeg",.94);
}

/*
==========================================================
CAMERA RECOVERY AFTER APP/BROWSER SWITCH
==========================================================

Mobile browsers can suspend or release the camera stream when
the page is backgrounded. READY remains visible and enabled.
When the page returns, the code checks the camera track and
automatically restarts it if necessary.
*/

document.addEventListener("visibilitychange",async()=>{
 if(document.visibilityState==="hidden"){
  wasCameraActive=!!stream;
  return;
 }

 if(document.visibilityState==="visible"){
  ready.disabled=false;
  ready.classList.remove("hidden");

  if(!wasCameraActive)return;

  try{
   const tracks=stream?.getVideoTracks?.()||[];
   const live=tracks.some(
    track=>track.readyState==="live"
   );

   if(!live||!video.srcObject){
    setStatus(
     "Camera resumed. Restarting camera..."
    );

    const ok=await startCamera();

    if(ok){
     await setZoom(zoom);
     updateOrientationFromScreen();
     getGPS();
     setStatus("Camera ready.");
    }

   }else{
    try{
     await video.play();
    }catch{}

    updateLiveOverlay();
    setStatus("Camera ready.");
   }

  }catch{
   setStatus(
    "Camera needs to be restarted. Press ▶️."
   );
  }
 }
});

window.addEventListener("pageshow",async()=>{
 ready.disabled=false;
 ready.classList.remove("hidden");

 if(!wasCameraActive)return;

 try{
  const tracks=stream?.getVideoTracks?.()||[];
  const live=tracks.some(
   track=>track.readyState==="live"
  );

  if(!live||!video.srcObject){
   const ok=await startCamera();

   if(ok){
    await setZoom(zoom);
    updateOrientationFromScreen();
    getGPS();
   }

  }else{
   try{
    await video.play();
   }catch{}

   updateLiveOverlay();
  }

 }catch{}
});

window.addEventListener("focus",()=>{
 ready.disabled=false;
 ready.classList.remove("hidden");
});

/* READY is always available. */
ready.addEventListener("click",async()=>{
 ready.disabled=false;

 if(!isSecure()){
  httpsWarning.classList.remove("hidden");
  setStatus("Camera and GPS require HTTPS.");
  return;
 }

 const ok=await startCamera();

 if(!ok){
  ready.disabled=false;
  return;
 }

 wasCameraActive=true;

 await startAutomaticOrientation();
 updateOrientationFromScreen();
 getGPS();

 if(gpsTimer)clearInterval(gpsTimer);

 gpsTimer=setInterval(()=>{
  if(stream)getGPS();
 },40000);

 setStatus("Camera and GPS ready.");
});

switchCamera.addEventListener(
 "click",
 switchCameraMode
);

zoomOut.addEventListener(
 "click",
 ()=>setZoom(zoom-.5)
);

zoomIn.addEventListener(
 "click",
 ()=>setZoom(zoom+.5)
);

flash.addEventListener(
 "click",
 cycleFlash
);

capture.addEventListener(
 "click",
 capturePhoto
);

window.addEventListener("beforeunload",()=>{
 if(gpsTimer)clearInterval(gpsTimer);
 stopCamera();

 if(lastObjectUrl){
  URL.revokeObjectURL(lastObjectUrl);
 }
});
</script>
