<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>GPS PHOTO: GEO TAGGING</title>
<style>
:root{
  --maroon:#A20404;
  --gold:#FBBC09;
  --bg:#f3f4f6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:#111;font-family:Arial,sans-serif}
header{background:#fff;padding:12px;border-bottom:1px solid #ddd;text-align:center}
header h1{margin:0;font-size:20px}
main{max-width:1100px;margin:auto;padding:12px}

label{display:block;font-weight:800;margin:14px 0 6px}
input[type=text],input[type=file]{
  width:100%;padding:11px;border:1px solid #cbd5e1;

}
input[type=file]{background:#f8fafc}

  display:none;max-width:150px;max-height:80px;margin-top:7px;

}
#status{margin-top:10px;background:#f1f5f9;padding:10px;border-radius:8px;font-size:14px}

</style>

<body>
<header><h1>GPS PHOTO: GEO TAGGING</h1></header>

<main>
<div class="card">

  <div class="camera">
    <div id="placeholder">
      <div class="icon">📷</div>
      <h2>GPS PHOTO: GEO TAGGING</h2>
      <p>Press READY to start.</p>
    </div>

    <video id="video" autoplay muted playsinline></video>

    <div id="liveBox">
      <div id="liveLines"></div>
    </div>
  </div>

  <div class="controls">
    <button id="ready">READY</button>
    <button id="switchCamera" class="secondary hidden">SWITCH CAMERA</button>
    <button id="zoomOut" class="zoom hidden">−</button>
    <span id="zoomText" class="zoomText hidden">Zoom 1.0×</span>
    <button id="zoomIn" class="zoom hidden">+</button>
    <button id="capture" class="hidden">CAPTURE PHOTO</button>
  </div>

  <label for="additional">Additional Information</label>
  <input id="additional" type="text" placeholder="Enter additional information">

  <label for="visited">Visited By</label>
  <input id="visited" type="text" placeholder="Enter name">

  <label for="logo">Company Logo</label>
  <input id="logo" type="file" accept="image/png,image/jpeg,image/webp">
  <img id="logoPreview" alt="Logo preview">

  <div id="status">Press READY.</div>

  <div id="httpsWarning" class="warning hidden">
    Camera and GPS require HTTPS. Publish this index.html on GitHub Pages,
    Netlify, or another HTTPS host.
  </div>

</div>
</main>

<script>
"use strict";

/* =========================================================
   ELEMENTS
   ========================================================= */
const video=document.getElementById("video");
const placeholder=document.getElementById("placeholder");
const liveBox=document.getElementById("liveBox");
const liveLines=document.getElementById("liveLines");
const ready=document.getElementById("ready");
const switchCamera=document.getElementById("switchCamera");
const zoomOut=document.getElementById("zoomOut");
const zoomIn=document.getElementById("zoomIn");
const zoomText=document.getElementById("zoomText");
const capture=document.getElementById("capture");
const additional=document.getElementById("additional");
const visited=document.getElementById("visited");
const logo=document.getElementById("logo");
const logoPreview=document.getElementById("logoPreview");
const status=document.getElementById("status");
const httpsWarning=document.getElementById("httpsWarning");

/* =========================================================
   STATE
   ========================================================= */
let stream=null;
let gpsTimer=null;
let facing="environment";
let zoom=1;
let outputRotation=0; // Automatically detected: 0, 90, 180, 270
let deviceAngle=0;
let orientationListenerStarted=false;
let motionPermissionRequested=false;
let logoImage=null;
let lastObjectUrl=null;

const gps={
  lat:null,
  lon:null,
  accuracy:null,
  address:"",
  countryCode:"",
  countryName:"",
  plusCode:""
};

/* =========================================================
   SECURITY
   ========================================================= */
function isSecure(){
  return window.isSecureContext ||
         location.hostname==="localhost" ||
         location.hostname==="127.0.0.1";
}

if(!isSecure()){
  httpsWarning.classList.remove("hidden");
}

function setStatus(text){
  status.textContent=text;
}

/* =========================================================
   COUNTRY FLAG
   ========================================================= */
function countryFlag(code){
  code=String(code||"").toUpperCase();
  if(!/^[A-Z]{2}$/.test(code)) return "";
  return String.fromCodePoint(
    ...[...code].map(c=>127397+c.charCodeAt(0))
  );
}

/* =========================================================
   DATE / TIME
   ========================================================= */
function getGMTOffset(date=new Date()){
  const minutes=-date.getTimezoneOffset();
  const sign=minutes>=0?"+":"-";
  const absolute=Math.abs(minutes);
  const h=String(Math.floor(absolute/60)).padStart(2,"0");
  const m=String(absolute%60).padStart(2,"0");
  return "GMT"+sign+h+":"+m;
}

function dateTimeInfo(){
  const d=new Date();

  return {
    day:d.toLocaleDateString(undefined,{weekday:"long"}),
    date:d.toLocaleDateString("en-GB"),
    time:d.toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }),
    gmt:getGMTOffset(d)
  };
}

/* =========================================================
   PLUS CODE
   ========================================================= */
function generatePlusCode(latitude,longitude){
  /*
    Open Location Code compatible short/full precision encoder.
    Produces a 10-digit Plus Code such as 7MF6RQ8R+8P.
  */
  const alphabet="23456789CFGHJMPQRVWX";

  let lat=Number(latitude);
  let lon=Number(longitude);

  if(!Number.isFinite(lat)||!Number.isFinite(lon)) return "";

  lat=Math.max(-90,Math.min(90,lat));
  lon=((lon+180)%360+360)%360-180;

  if(lat===90) lat-=1e-12;

  lat+=90;
  lon+=180;

  const placeValues=[20,1,.05,.0025,.000125];

  let code="";

  for(const placeValue of placeValues){
    let latDigit=Math.floor(lat/placeValue);
    let lonDigit=Math.floor(lon/placeValue);

    latDigit=Math.max(0,Math.min(19,latDigit));
    lonDigit=Math.max(0,Math.min(19,lonDigit));

    code+=alphabet[latDigit]+alphabet[lonDigit];

    lat-=latDigit*placeValue;
    lon-=lonDigit*placeValue;
  }

  return code.slice(0,8)+"+"+code.slice(8,10);
}

/* =========================================================
   TEXT WRAPPING
   ========================================================= */
function wrapText(ctx,text,font,maxWidth){
  ctx.font=font;

  const words=String(text||"").trim().split(/\s+/);
  if(!words.length||!words[0]) return [];

  const lines=[];
  let line="";

  for(const word of words){
    const candidate=line?line+" "+word:word;

    if(ctx.measureText(candidate).width<=maxWidth){
      line=candidate;
      continue;
    }

    if(line){
      lines.push(line);
      line="";
    }

    if(ctx.measureText(word).width<=maxWidth){
      line=word;
      continue;
    }

    let piece="";

    for(const ch of word){
      if(ctx.measureText(piece+ch).width<=maxWidth){
        piece+=ch;
      }else{
        if(piece) lines.push(piece);
        piece=ch;
      }
    }

    line=piece;
  }

  if(line) lines.push(line);

  return lines;
}

/* =========================================================
   CAMERA
   ========================================================= */
function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
  }

  stream=null;
  video.srcObject=null;
  liveBox.style.display="none";
}

async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      setStatus("Camera is not supported by this browser.");
      return false;
    }

    stopCamera();

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:facing},
        width:{ideal:1920},
        height:{ideal:1080}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    placeholder.style.display="none";
    video.style.display="block";
    liveBox.style.display="block";

    switchCamera.classList.remove("hidden");
    zoomOut.classList.remove("hidden");
    zoomIn.classList.remove("hidden");
    zoomText.classList.remove("hidden");
    capture.classList.remove("hidden");

    zoom=1;
    video.style.transform="scale(1)";
    updateZoomUI();
    updateLiveOverlay();

    return true;

  }catch(error){

    if(error.name==="NotAllowedError"){
      setStatus("Camera permission denied. Allow camera access in browser settings.");
    }else{
      setStatus("Camera error: "+(error.message||error.name));
    }

    return false;
  }
}

/* =========================================================
   CAMERA SWITCH
   ========================================================= */
async function switchCameraMode(){
  facing=facing==="environment"?"user":"environment";
  await startCamera();
  getGPS();
}

/* =========================================================
   AUTOMATIC PHONE ORIENTATION
   ========================================================= */
function normalizeOrientationAngle(angle){
  angle=((Number(angle)||0)%360+360)%360;
  if(angle<45 || angle>=315) return 0;
  if(angle<135) return 90;
  if(angle<225) return 180;
  return 270;
}

function updateOrientationFromScreen(){
  try{
    if(screen.orientation &&
       Number.isFinite(screen.orientation.angle)){
      const a=normalizeOrientationAngle(screen.orientation.angle);
      deviceAngle=a;
      outputRotation=a;
      updateLiveOverlay();
    }
  }catch{}
}

function handleDeviceOrientation(event){
  const beta=Number(event.beta);
  const gamma=Number(event.gamma);
  if(!Number.isFinite(beta)||!Number.isFinite(gamma)) return;

  let a=deviceAngle;
  if(Math.abs(gamma)>35){
    a=gamma>0?90:270;
  }else if(Math.abs(beta)>135){
    a=180;
  }else{
    a=0;
  }

  if(a!==deviceAngle){
    deviceAngle=a;
    outputRotation=a;
    updateLiveOverlay();
  }
}

async function startAutomaticOrientation(){
  if(motionPermissionRequested) return;
  motionPermissionRequested=true;

  try{
    if(typeof DeviceOrientationEvent!=="undefined" &&
       typeof DeviceOrientationEvent.requestPermission==="function"){
      const result=await DeviceOrientationEvent.requestPermission();
      if(result!=="granted"){
        setStatus("Motion permission was not granted. Automatic photo orientation may be unavailable.");
        return;
      }
    }
  }catch{}

  try{
    window.addEventListener("deviceorientation",handleDeviceOrientation,true);
  }catch{}

  try{
    if(screen.orientation){
      screen.orientation.addEventListener("change",updateOrientationFromScreen);
    }
    window.addEventListener("orientationchange",updateOrientationFromScreen);
  }catch{}

  updateOrientationFromScreen();
}

/* =========================================================
   ZOOM
   ========================================================= */
async function setZoom(value){
  value=Math.max(1,Math.min(8,value));

  const track=stream?.getVideoTracks?.()[0];

  if(track){
    try{
      const capabilities=track.getCapabilities?.()||{};

      if(capabilities.zoom){
        const min=Number(capabilities.zoom.min??1);
        const max=Math.min(8,Number(capabilities.zoom.max??8));
        const step=Number(capabilities.zoom.step??.1);

        value=Math.min(
          max,
          Math.max(
            min,
            Math.round(value/step)*step
          )
        );

        await track.applyConstraints({
          advanced:[{zoom:value}]
        });

        video.style.transform="scale(1)";

      }else{
        video.style.transform="scale("+value+")";
      }

    }catch{
      video.style.transform="scale("+value+")";
    }
  }

  zoom=value;
  updateZoomUI();
}

function updateZoomUI(){
  zoomText.textContent="Zoom "+zoom.toFixed(1)+"×";
  zoomOut.disabled=zoom<=1;
  zoomIn.disabled=zoom>=8;
}

/* =========================================================
   REVERSE GEOCODING
   ========================================================= */
async function reverseGeocode(lat,lon){

  try{
    const url=
      "https://nominatim.openstreetmap.org/reverse"+
      "?format=jsonv2"+
      "&addressdetails=1"+
      "&zoom=18"+
      "&lat="+encodeURIComponent(lat)+
      "&lon="+encodeURIComponent(lon);

    const response=await fetch(url,{
      headers:{Accept:"application/json"}
    });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data=await response.json();
    const a=data.address||{};

    gps.address=
      data.display_name ||
      [
        a.road,
        a.neighbourhood,
        a.suburb,
        a.village,
        a.town,
        a.city,
        a.district,
        a.state_district,
        a.state,
        a.postcode,
        a.country
      ].filter(Boolean).join(", ") ||
      gps.address ||
      "Address unavailable";

    gps.countryCode=
      String(a.country_code||gps.countryCode||"").toUpperCase();

    gps.countryName=
      String(a.country||gps.countryName||"").trim();

    const f=countryFlag(gps.countryCode);

    if(f&&!gps.address.includes(f)){
      if(gps.countryName){
        const lower=gps.address.toLowerCase();
        const countryLower=gps.countryName.toLowerCase();
        const index=lower.lastIndexOf(countryLower);

        if(index>=0){
          gps.address=
            gps.address.slice(0,index)+
            gps.address.slice(index,index+gps.countryName.length)+
            " "+f+
            gps.address.slice(index+gps.countryName.length);
        }else{
          gps.address+=" "+f;
        }
      }else{
        gps.address+=" "+f;
      }
    }

    updateLiveOverlay();

  }catch(error){
    setStatus("GPS is working, but address lookup is temporarily unavailable.");
  }
}

/* =========================================================
   GPS
   ========================================================= */
function applyGPSPosition(position){
  gps.lat=Number(position.coords.latitude);
  gps.lon=Number(position.coords.longitude);
  gps.accuracy=Number(position.coords.accuracy);

  gps.plusCode=generatePlusCode(gps.lat,gps.lon);

  updateLiveOverlay();
}

function getGPS(){
  if(!navigator.geolocation){
    setStatus("GPS is not supported by this browser.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async position=>{
      applyGPSPosition(position);

      await reverseGeocode(
        gps.lat,
        gps.lon
      );

      setStatus("GPS updated: "+new Date().toLocaleTimeString());
    },
    error=>{
      if(error.code===1){
        setStatus("Location permission denied. Allow Location access in browser settings.");
      }else{
        setStatus("Unable to get GPS location. Trying again.");
      }
    },
    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }
  );
}

function freshGPS(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error("GPS unavailable"));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async position=>{
        applyGPSPosition(position);

        try{
          await reverseGeocode(
            gps.lat,
            gps.lon
          );
        }catch{}

        resolve();
      },
      reject,
      {
        enableHighAccuracy:true,
        timeout:12000,
        maximumAge:0
      }
    );
  });
}

/* =========================================================
   LIVE OVERLAY
   ========================================================= */
function escapeHTML(value){
  return String(value).replace(/[&<>"]/g,ch=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;"
  }[ch]));
}

function updateLiveOverlay(){

  if(!stream) return;

  const t=dateTimeInfo();

  const lines=[
    gps.address||"Waiting for address...",
    gps.plusCode||"—",
    "LATITUDE: "+(
      gps.lat==null?"—":gps.lat.toFixed(6)+"°"
    )+
    "   |   LONGITUDE: "+(
      gps.lon==null?"—":gps.lon.toFixed(6)+"°"
    ),
    t.day+
    " | DATE: "+t.date+
    " | TIME: "+t.time+
    " | "+t.gmt,
    "ACCURACY: "+
    (
      gps.accuracy==null?
      "—":
      Math.round(gps.accuracy)+" m"
    )
  ];

  if(additional.value.trim()){
    lines.push(additional.value.trim());
  }

  if(visited.value.trim()){
    lines.push("Visited By: "+visited.value.trim());
  }

  liveLines.innerHTML=
    lines.map(line=>
      "<div class='liveLine'>"+
      escapeHTML(line)+
      "</div>"
    ).join("");
}

/* =========================================================
   LOGO
   ========================================================= */
logo.addEventListener("change",()=>{
  const file=logo.files?.[0];

  if(!file){
    logoImage=null;
    logoPreview.style.display="none";
    return;
  }

  const reader=new FileReader();

  reader.onload=event=>{
    const image=new Image();

    image.onload=()=>{
      logoImage=image;
      logoPreview.src=event.target.result;
      logoPreview.style.display="block";
    };

    image.src=event.target.result;
  };

  reader.readAsDataURL(file);
});

/* =========================================================
   LIVE INPUTS
   ========================================================= */
additional.addEventListener("input",updateLiveOverlay);
visited.addEventListener("input",updateLiveOverlay);

/* =========================================================
   CANVAS HELPERS
   ========================================================= */
function roundedRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);

  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function textHeight(lines,size,gap,blockGap){
  if(!lines.length) return 0;
  return lines.length*(size+gap)+blockGap-gap;
}

/* =========================================================
   CAPTURE
   ========================================================= */
async function capturePhoto(){

  if(!stream||!video.videoWidth){
    setStatus("Camera is not ready.");
    return;
  }

  capture.disabled=true;
  setStatus("Getting current GPS position...");

  try{
    await freshGPS();
  }catch{
    /* Keep the last valid GPS reading. */
  }

  renderFinalPhoto();
}

/* =========================================================
   FINAL CANVAS RENDERER
   ========================================================= */
function renderFinalPhoto(){

  if(
    gps.lat!=null&&
    gps.lon!=null
  ){
    gps.plusCode=
      generatePlusCode(
        gps.lat,
        gps.lon
      );
  }

  const sourceW=video.videoWidth;
  const sourceH=video.videoHeight;

  const border=
    Math.max(
      6,
      Math.round(Math.max(sourceW,sourceH)*.006)
    );

  /*
    90° / 270° rotation swaps the final canvas width and height.
    This is independent of the device auto-rotate setting.
  */
  /*
    outputRotation is supplied automatically by the phone's
    orientation sensor. No manual rotate button is required.
  */
  const rotated=
    outputRotation===90 ||
    outputRotation===270;

  const imageW=rotated?sourceH:sourceW;
  const imageH=rotated?sourceW:sourceH;

  const W=imageW+border*2;
  const H=imageH+border*2;

  const canvas=document.createElement("canvas");
  canvas.width=W;
  canvas.height=H;

  const ctx=canvas.getContext("2d");

  /* ---------------------------------------------------------
     CAMERA FRAME
     --------------------------------------------------------- */
  ctx.save();

  if(outputRotation===90){
    ctx.translate(W,0);
    ctx.rotate(Math.PI/2);
  }else if(outputRotation===180){
    ctx.translate(W,H);
    ctx.rotate(Math.PI);
  }else if(outputRotation===270){
    ctx.translate(0,H);
    ctx.rotate(-Math.PI/2);
  }

  /*
    Draw the source frame in its native dimensions. The transform
    above rotates it into the requested final orientation.
  */
  if(zoom<=1.001){

    ctx.drawImage(
      video,
      border,
      border,
      sourceW,
      sourceH
    );

  }else{

    const cropW=sourceW/zoom;
    const cropH=sourceH/zoom;
    const cropX=(sourceW-cropW)/2;
    const cropY=(sourceH-cropH)/2;

    ctx.drawImage(
      video,
      cropX,
      cropY,
      cropW,
      cropH,
      border,
      border,
      sourceW,
      sourceH
    );
  }

  ctx.restore();

  /* ---------------------------------------------------------
     PHOTO BORDER
     ---------------------------------------------------------
  ctx.lineWidth=border;
  ctx.strokeStyle="#A20404";

  ctx.strokeRect(
    border/2,
    border/2,
    W-border,
    H-border
  );

  /* ---------------------------------------------------------
     PANEL GEOMETRY
     --------------------------------------------------------- */
  const panelW=Math.min(
    W-40,
    W*.92
  );

  const panelX=(W-panelW)/2;

  const pad=Math.max(
    22,
    Math.round(W*.025)
  );

  const contentW=panelW-pad*2;

  /*
    Address = 36pt = 48px.
    All other requested information = 24pt = 32px.
  */
  const addressSize=48;
  const bodySize=32;

  const addressFont=
    "bold 48px Georgia,serif";

  const normalFont=
    size=>"bold "+size+"px Georgia,serif";

  const gap=Math.max(
    7,
    Math.round(bodySize*.18)
  );

  const blockGap=Math.max(
    10,
    Math.round(bodySize*.28)
  );

  const topPad=Math.max(
    22,
    Math.round(bodySize*.7)
  );

  const bottomPad=Math.max(
    22,
    Math.round(bodySize*.6)
  );

  /* ---------------------------------------------------------
     TEXT CONTENT
     --------------------------------------------------------- */
  const addressText=
    gps.address||
    "Address unavailable";

  const addressLines=
    wrapText(
      ctx,
      addressText,
      addressFont,
      contentW
    );

  const plusCodeText=
    gps.plusCode||"—";

  const plusCodeLines=
    wrapText(
      ctx,
      plusCodeText,
      normalFont(bodySize),
      contentW
    );

  /* ---------------------------------------------------------
     LATITUDE + LONGITUDE
     FORCE ONE PHYSICAL LINE
     --------------------------------------------------------- */
  const latText=
    "LATITUDE: "+
    (
      gps.lat==null?
      "—":
      gps.lat.toFixed(6)+"°"
    );

  const lonText=
    "LONGITUDE: "+
    (
      gps.lon==null?
      "—":
      gps.lon.toFixed(6)+"°"
    );

  const latLonText=
    latText+
    "   |   "+
    lonText;

  let latLonSize=bodySize;

  while(latLonSize>10){

    ctx.font=
      normalFont(latLonSize);

    if(
      ctx.measureText(latLonText).width<=contentW
    ){
      break;
    }

    latLonSize--;
  }

  const latLonFont=
    normalFont(latLonSize);

  /* ---------------------------------------------------------
     DAY + DATE + TIME + GMT
     FORCE ONE PHYSICAL LINE
     --------------------------------------------------------- */
  const t=dateTimeInfo();

  const dateTimeText=
    t.day+
    " | DATE: "+
    t.date+
    " | TIME: "+
    t.time+
    " | "+
    t.gmt;

  let dateTimeSize=bodySize;

  while(dateTimeSize>10){

    ctx.font=
      normalFont(dateTimeSize);

    if(
      ctx.measureText(dateTimeText).width<=contentW
    ){
      break;
    }

    dateTimeSize--;
  }

  const dateTimeFont=
    normalFont(dateTimeSize);

  const accuracyText=
    "ACCURACY: "+
    (
      gps.accuracy==null?
      "—":
      Math.round(gps.accuracy)+" m"
    );

  const accuracyLines=[
    accuracyText
  ];

  const extraText=
    additional.value.trim();

  const visitorText=
    visited.value.trim();

  const extraLines=
    extraText?
    wrapText(
      ctx,
      extraText,
      normalFont(bodySize),
      contentW
    ):
    [];

  const visitorLines=
    visitorText?
    wrapText(
      ctx,
      "Visited By: "+visitorText,
      normalFont(bodySize),
      contentW
    ):
    [];

  /* ---------------------------------------------------------
     LOGO SIZE
     --------------------------------------------------------- */
  let logoW=0;
  let logoH=0;

  if(logoImage){

    const maxLogoW=
      Math.min(
        contentW*.22,
        180
      );

    const maxLogoH=
      Math.min(
        H*.10,
        110
      );

    const scale=
      Math.min(
        maxLogoW/logoImage.width,
        maxLogoH/logoImage.height,
        1
      );

    logoW=
      logoImage.width*scale;

    logoH=
      logoImage.height*scale;
  }

  /* ---------------------------------------------------------
     DYNAMIC PANEL HEIGHT
     --------------------------------------------------------- */
  let panelH=
    topPad+

    textHeight(
      addressLines,
      addressSize,
      gap,
      blockGap
    )+

    textHeight(
      plusCodeLines,
      bodySize,
      gap,
      blockGap
    )+

    (
      latLonSize+
      gap+
      blockGap
    )+

    (
      dateTimeSize+
      gap+
      blockGap
    )+

    textHeight(
      accuracyLines,
      bodySize,
      gap,
      blockGap
    )+

    (
      extraLines.length?
      textHeight(
        extraLines,
        bodySize,
        gap,
        blockGap
      ):
      0
    )+

    (
      visitorLines.length?
      textHeight(
        visitorLines,
        bodySize,
        gap,
        blockGap
      ):
      0
    );

  if(logoImage){
    panelH+=
      logoH+
      Math.round(blockGap*.5);
  }

  panelH+=bottomPad;

  /*
    Prevent the panel from exceeding the photograph.
    Text itself remains readable as far as the physical canvas allows.
  */
  const maxPanelH=H-border*2-16;

  if(panelH>maxPanelH){
    panelH=maxPanelH;
  }

  const panelY=
    Math.max(
      border+8,
      H-panelH-Math.max(18,H*.025)
    );

  /* ---------------------------------------------------------
     INFORMATION BOX
     --------------------------------------------------------- */
  ctx.fillStyle=
    "rgba(255,255,255,.50)";

  roundedRect(
    ctx,
    panelX,
    panelY,
    panelW,
    panelH,
    20
  );

  ctx.fill();

  ctx.lineWidth=
    Math.max(
      2,
      Math.round(W*.002)
    );

  ctx.strokeStyle="#FBBC09";

  ctx.stroke();

  /* ---------------------------------------------------------
     ALL TEXT CENTERED
     --------------------------------------------------------- */
  ctx.fillStyle="#000";
  ctx.textAlign="center";
  ctx.textBaseline="alphabetic";

  const centerX=
    panelX+
    panelW/2;

  let y=
    panelY+
    topPad;

  function drawCenteredWrapped(
    lines,
    font,
    size
  ){

    ctx.font=font;

    for(const line of lines){

      y+=size;

      ctx.fillText(
        line,
        centerX,
        y
      );

      y+=gap;
    }

    y+=blockGap-gap;
  }

  /* ADDRESS - CENTERED */
  drawCenteredWrapped(
    addressLines,
    addressFont,
    addressSize
  );

  /* PLUS CODE - CENTERED */
  drawCenteredWrapped(
    plusCodeLines,
    normalFont(bodySize),
    bodySize
  );

  /* LATITUDE + LONGITUDE - ONE PHYSICAL LINE */
  ctx.font=latLonFont;

  y+=latLonSize;

  ctx.fillText(
    latLonText,
    centerX,
    y
  );

  y+=
    gap+
    blockGap-
    gap;

  /* DAY + DATE + TIME + GMT - ONE PHYSICAL LINE */
  ctx.font=dateTimeFont;

  y+=dateTimeSize;

  ctx.fillText(
    dateTimeText,
    centerX,
    y
  );

  y+=
    gap+
    blockGap-
    gap;

  /* ACCURACY - CENTERED */
  drawCenteredWrapped(
    accuracyLines,
    normalFont(bodySize),
    bodySize
  );

  /* ADDITIONAL INFORMATION - CENTERED */
  if(extraLines.length){

    drawCenteredWrapped(
      extraLines,
      normalFont(bodySize),
      bodySize
    );
  }

  /* VISITED BY - CENTERED */
  if(visitorLines.length){

    drawCenteredWrapped(
      visitorLines,
      normalFont(bodySize),
      bodySize
    );
  }

  /* ---------------------------------------------------------
     LOGO - BOTTOM RIGHT, INDEPENDENT OF TEXT ALIGNMENT
     --------------------------------------------------------- */
  if(logoImage){

    const logoX=
      panelX+
      panelW-
      pad-
      logoW;

    const logoY=
      panelY+
      panelH-
      bottomPad-
      logoH;

    ctx.drawImage(
      logoImage,
      logoX,
      logoY,
      logoW,
      logoH
    );
  }

  /* ---------------------------------------------------------
     JPG DOWNLOAD
     --------------------------------------------------------- */
  canvas.toBlob(
    blob=>{

      if(!blob){

        setStatus(
          "Could not create JPG."
        );

        capture.disabled=false;
        return;
      }

      if(lastObjectUrl){
        URL.revokeObjectURL(
          lastObjectUrl
        );
      }

      lastObjectUrl=
        URL.createObjectURL(blob);

      const a=
        document.createElement("a");

      const d=new Date();

      const filename=
        "GPS-PHOTO-"+
        d.getFullYear()+"-"+
        String(d.getMonth()+1).padStart(2,"0")+"-"+
        String(d.getDate()).padStart(2,"0")+"-"+
        String(d.getHours()).padStart(2,"0")+"-"+
        String(d.getMinutes()).padStart(2,"0")+"-"+
        String(d.getSeconds()).padStart(2,"0")+
        ".jpg";

      a.href=lastObjectUrl;
      a.download=filename;

      document.body.appendChild(a);
      a.click();
      a.remove();

      setStatus(
        "Photo captured and downloaded automatically."
      );

      /*
        Restart camera for the next photograph.
      */
      setTimeout(
        async()=>{
          const ok=
            await startCamera();

          capture.disabled=false;

          if(ok){
            getGPS();
            setStatus(
              "Ready for the next photo."
            );
          }
        },
        500
      );

    },
    "image/jpeg",
    .94
  );
}

/* =========================================================
   BUTTONS
   ========================================================= */
ready.addEventListener(
  "click",
  async()=>{

    if(!isSecure()){

      httpsWarning.classList.remove(
        "hidden"
      );

      setStatus(
        "Camera and GPS require HTTPS."
      );

      return;
    }

    ready.disabled=true;
    const cameraStarted=
      await startCamera();

    if(!cameraStarted){

      ready.disabled=false;
      return;
    }

    await startAutomaticOrientation();
    updateOrientationFromScreen();

    await requestMotionPermissionIfNeeded();
    updateOutputOrientationFromScreen();

    getGPS();

    if(gpsTimer){
      clearInterval(gpsTimer);
    }

    gpsTimer=
      setInterval(
        ()=>{
          if(stream){
            getGPS();
          }
        },
        40000
      );

    ready.textContent="READY ✓";
  }
);

switchCamera.addEventListener(
  "click",
  switchCameraMode
);


zoomOut.addEventListener(
  "click",
  ()=>setZoom(zoom-.5)
);

zoomIn.addEventListener(
  "click",
  ()=>setZoom(zoom+.5)
);

capture.addEventListener(
  "click",
  capturePhoto
);

/* =========================================================
   CLEANUP
   ========================================================= */
window.addEventListener(
  "beforeunload",
  ()=>{
    if(gpsTimer){
      clearInterval(gpsTimer);
    }

    stopCamera();

    if(lastObjectUrl){
      URL.revokeObjectURL(
        lastObjectUrl
      );
    }
  }
);
</script>
</body>
</html>
